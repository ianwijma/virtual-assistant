<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To approve, group 3: layout and the desktop</title>
<!--
  Twelve small decisions (361 to 372) drawn one per tile, for the owner to
  approve at a glance. Nothing here is new: each tile shows a decision.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: 8px 8px 10px; }
  .page > h1 { font: var(--type-title); margin: 0 0 var(--s-2); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { position: relative; height: 252px; padding: 10px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
  .th { display: flex; align-items: center; gap: 10px; height: 40px; flex: none; }
  .num-badge { min-width: 44px; height: 36px; padding: 0 6px; border-radius: var(--r-md); display: grid; place-items: center; flex: none; font: 700 19px/1 var(--font-sans); background: var(--accent); color: var(--on-accent); }
  .th .t { font: 600 14px/17px var(--font-sans); }
  .art { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 12px; position: relative; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cap { font: 500 11px/14px var(--font-sans); color: var(--text-2); text-align: center; }
  .i { display: block; flex: none; }
  .stage { position: relative; overflow: hidden; border-radius: var(--r-md); color: var(--text); }
  .abs { position: absolute; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk { background: var(--control-hover); border-radius: 2px; }

  /* phone */
  .ptop { left: 6px; right: 6px; top: 6px; height: 20px; display: flex; align-items: center; padding: 0 8px; border-radius: var(--r-full); font: 600 9px/1 var(--font-sans); }
  .ptb { left: 6px; right: 6px; bottom: 6px; display: flex; align-items: center; justify-content: space-around; padding: 4px 2px; border-radius: var(--r-lg); }
  .ptb > span { position: relative; display: grid; place-items: center; width: 22px; height: 22px; border-radius: var(--r-sm); color: var(--text-2); }
  .ptb > .on { background: var(--accent-soft); color: var(--text); }
  .ptb > .sep { width: 1px; height: 16px; background: var(--line); border-radius: 0; }
  .bub { font: 500 8px/1.2 var(--font-sans); padding: 4px 6px; border-radius: 8px; background: var(--control); max-width: 74%; }
  .bub.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); }
  .pdot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--glass-solid); }

  /* ruler */
  .rz { display: flex; width: 100%; }
  .rz > div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
  .mf { position: relative; height: 46px; display: flex; gap: 2px; padding: 3px; border-radius: 6px; }
  .mf .card { position: absolute; top: 3px; right: 3px; width: 14px; height: 7px; border-radius: 2px; background: var(--accent); z-index: 2; }
  .seg { height: 6px; border-radius: 3px; }

  /* launcher mini */
  .mini-l { display: flex; flex-direction: column; gap: 3px; padding: 6px; }
  .mini-l .f { height: 8px; border-radius: 4px; background: var(--control-hover); }
  .mini-l .r { height: 5px; border-radius: 2px; background: var(--control-hover); }
  .mini-l .r.s { background: var(--accent-soft); }

  /* admin */
  .adm { width: 100%; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .adm .h { font: 600 11px/14px var(--font-sans); }
  .slot { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; border-radius: var(--r-sm); background: var(--accent-soft); font: 500 11px/1 var(--font-sans); }
  .slot b { width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font: 700 9px/1 var(--font-sans); flex: none; }
  .pick { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; font: 500 11px/1 var(--font-sans); color: var(--text); }
  .pick + .pick { border-top: 1px solid var(--line); }
  .pick .sp, .slot .sp { flex: 1; }

  /* menus and cards */
  .mrow { display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 8px; border-radius: var(--r-xs); font: 500 11px/1 var(--font-sans); }
  .mrow.sel { background: var(--accent-soft); }
  .ncard { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .ncard .hd { display: flex; align-items: center; gap: 8px; }
  .ncard .tx { font: 600 12px/15px var(--font-sans); }
  .ncard .sb { font: 500 10px/13px var(--font-sans); color: var(--text-2); }
  .ncard .btns { display: flex; gap: 6px; }
  .ncard .btn { flex: 1; height: 26px; padding: 0 8px; font-size: 11px; border-radius: var(--r-sm); }
  .ncard .kbd { font-size: 9px; padding: 1px 4px; }

  .lr { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: var(--r-sm); font: 500 11px/1 var(--font-sans); }
  .lr.sel { background: var(--accent-soft); }
  .lr .sp { flex: 1; }
  .use { width: 70px; height: 6px; border-radius: 3px; background: var(--control); overflow: hidden; flex: none; }
  .use i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .gi { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .gi .bx { width: 28px; height: 28px; border-radius: var(--r-md); background: var(--control); display: grid; place-items: center; }
  .gi.mine .bx { background: var(--accent-soft); }
  .gi .l { font: 500 7px/9px var(--font-sans); white-space: nowrap; }
  .tbb { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 56px; padding: 7px 0; border-radius: var(--r-md); font: 500 11px/1 var(--font-sans); color: var(--text-2); }
  .tbb.on { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .esc { display: flex; flex-direction: column; align-items: center; gap: 2px; }
</style>
</head>

  /* a push pin, drawn as a simple outline (the icon set copy has none) */

        [['home', 'Overview'], ['timer', 'Timers'], ['lists', 'Lists'], ['assistant', 'Assistant']].map(function (a, i) { return '<div class="slot"><b>' + (i + 1) + '</b>' + ic(a[0], 13) + '<span>' + a[1] + '</span></div>'; }).join('') + '</div>' +

  function miniList() { return '<div class="stage backdrop" style="width:100%;height:58px"><div class="abs glass-thick mini-l" style="inset:5px;border-radius:var(--r-md)"><div class="f"></div><div class="r s"></div><div class="r"></div><div class="r"></div></div></div>'; }

  /* 366 */
  T.push([366, 'The tray icon’s menu',

      '<div class="abs glass-thick" style="right:8px;top:28px;width:168px;padding:5px;border-radius:var(--r-md)">' +
        '<div class="mrow sel">' + ic('search', 13) + 'Open launcher</div><div class="mrow">' + ic('gear', 13) + 'Settings</div><hr class="divider" style="margin:3px 0">' +

  /* 367 */

  }
  function escKey() { return '<div class="esc"><span class="kbd" style="font-size:11px;padding:3px 7px">Esc</span><span style="color:var(--text-2)">' + '<svg width="16" height="8" viewBox="0 0 16 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4h13M10 1l4 3-4 3"/></svg></span></div>'; }
  T.push([367, 'Esc: first clear search, then leave',
    '<div class="col" style="width:100%;gap:8px"><div style="display:flex;align-items:center;justify-content:space-between;width:100%">' +
      '<div class="step">' + sfr(1) + '<span class="cap">Search “sound”</span></div>' + escKey() +

    '<span class="cap">One press clears the search; the next leaves</span></div>']);

    '<div class="stage wallpaper compact" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">' +
      '<div class="glass ncard" style="width:236px"><div class="hd"><span class="character" style="--size:30px"></span><div style="flex:1"><div class="tx">Juno asks: add milk to the list?</div><div class="sb">Shopping</div></div></div>' +
      '<div class="btns"><span class="btn btn-primary is-focus">Yes <span class="kbd">Y</span></span><span class="btn">No <span class="kbd">N</span></span></div></div></div>']);

      '<div class="glass ncard" style="padding:8px 10px;gap:6px"><div class="hd"><span class="character" style="--size:24px"></span><div class="tx" style="flex:1">Add milk to the list?</div>' +

  T.push([370, 'Actions ordered by your own use',

      '<div class="cap" style="text-align:left;padding:0 8px 3px;text-transform:uppercase;letter-spacing:.04em">Most used first</div>' +
      US.map(function (u, i) { return '<div class="lr' + (i === 0 ? ' sel' : '') + '">' + ic(u[0], 14) + '<span class="sp">' + u[1] + '</span><span class="use"><i style="width:' + u[2] + '%"></i></span><span class="num t-2" style="width:18px;text-align:right;font-size:10px">' + u[3] + '</span></div>'; }).join('') + '</div></div>']);

  /* 371 */
  var AR = [['home', 'Overview'], ['assistant', 'Juno'], ['timeline', 'Timeline'], ['chat', 'Chat'], ['lists', 'Lists'], ['clip', 'Clipboard'], ['timer', 'Timers'], ['gear', 'Settings'], ['bell', 'Alarms'], ['users', 'People'], ['lock', 'Devices'], ['cart', 'Shopping']];
  T.push([371, 'The All sheet scrolls',
    '<div class="stage backdrop" style="width:188px;height:172px"><div class="abs glass ptop" style="width:auto">Overview</div>' +
      '<div class="abs" style="inset:0;background:color-mix(in srgb,var(--text) 25%,transparent)"></div>' +
      '<div class="abs glass-thick" style="left:6px;right:6px;top:30px;height:210px;padding:6px 6px;border-radius:var(--r-xl)">' +
        '<div style="width:26px;height:3px;border-radius:2px;background:var(--text-3);margin:0 auto 5px"></div><div class="t-heading" style="font-size:12px;margin-bottom:3px">All areas</div>' +
        '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px 0;padding-right:5px">' + AR.map(function (a, i) { return '<div class="gi' + (i < 4 ? ' mine' : '') + '"><span class="bx">' + ic(a[0], 16) + '</span><span class="l">' + a[1] + '</span></div>'; }).join('') + '</div>' +
        '<div class="abs" style="right:3px;top:44px;width:3px;height:44px;border-radius:2px;background:var(--text-3)"></div></div></div>' +
    '<div class="col" style="width:62px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M7 14l5-5 5 5"/><path d="M7 19l5-5 5 5"/></svg><div class="cap">Swipe up for more</div></div>']);

  /* 372 */
  T.push([372, 'The All button: grid icon and the word',

    '']);

  }).join('');
