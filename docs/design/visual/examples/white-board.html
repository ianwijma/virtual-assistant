<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light: pure white or a softer white</title>
<!--
  Is light a pure white, or a slightly tinted, softer white? Light mode only,
  the plain (non-glass) surfaces: the base and the content areas.
  Each option overrides --bg, --surface and --surface-2 on its own frames below.
  Nothing here is decided. Icons: Phosphor (MIT), inlined.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: 8px 8px 12px; }
  .page > h1 { font: var(--type-title); margin: 0 0 var(--s-2); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .opt { min-width: 0; }
  .head { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-2); }
  .letter { width: 44px; height: 44px; border-radius: var(--r-lg); display: grid; place-items: center; flex: none; font: 700 28px/1 var(--font-sans); background: var(--accent); color: var(--on-accent); }
  .opt h2 { font: 600 17px/21px var(--font-sans); margin: 0; }
  .opt .note { font: 500 12px/16px var(--font-sans); color: var(--text-2); margin: 0; }
  .frames { display: flex; gap: 10px; align-items: flex-start; }
  .cap { display: block; height: 15px; font: var(--type-caption); letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); }
  .hex { font: var(--type-mono); margin-top: var(--s-1); color: var(--text-2); }

  /* The four options: only the neutral tokens change. */
  .o-b { --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #FFFFFF; --glass-solid: #FFFFFF; }
  .o-c { --bg: #F7F4EF; --surface: #FFFDF9; --surface-2: #F7F4EF; --glass-solid: #FFFDF9; }
  .o-d { --bg: color-mix(in srgb, var(--accent) 4%, #F4F5F7);
         --surface: color-mix(in srgb, var(--accent) 4%, rgba(255,255,255,.62));
         --surface-2: color-mix(in srgb, var(--accent) 4%, #F4F5F7); }

  .frame { position: relative; height: 330px; border-radius: 14px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); color: var(--text); box-sizing: border-box; }
  .set { width: 350px; display: flex; }
  .ph { width: 160px; }
  .mini { width: 70px; height: 145px; border-radius: 8px; }
  .mini .inner { width: 160px; height: 330px; zoom: .43; position: relative; }
  .nav { width: 108px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: var(--s-2); border-right: 1px solid var(--line); }
  .nav .item { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: var(--r-sm); font: var(--type-label); white-space: nowrap; }
  .nav .item.on { background: var(--accent-soft); font-weight: 600; }
  .nav .search { height: 28px; padding: 0 6px; gap: 4px; overflow: hidden; font-size: 10px; text-transform: none; letter-spacing: 0; white-space: nowrap; margin-bottom: var(--s-1); }
  .nav .search .caret { display: none; }
  .mid { width: 84px; flex: none; border-right: 1px solid var(--line); padding: var(--s-2) 4px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
  .mid .hd { font: var(--type-caption); letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); padding: 2px 6px var(--s-1); }
  .mid .row { min-height: 36px; padding: 0 6px; gap: 6px; font: var(--type-label); border-radius: var(--r-sm); }
  .mid .row + .row { border-top: 0; }
  .pg { flex: 1; min-width: 0; background: var(--surface); padding: var(--s-3) var(--s-2); display: flex; flex-direction: column; gap: 7px; }
  .path { font: var(--type-caption); color: var(--text-2); letter-spacing: 0; text-transform: none; white-space: nowrap; }
  .fld { display: flex; flex-direction: column; gap: 2px; }
  .fld .field { height: 28px; padding: 0 var(--s-2); font: var(--type-label); }
  .tg { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); font: var(--type-label); }
  .para { font: 400 11px/15px var(--font-sans); color: var(--text-2); margin: 0; }

  .phone { position: relative; width: 160px; height: 330px; overflow: hidden; }
  .phone > * { position: absolute; }
  .sb { top: 8px; left: 16px; right: 16px; display: flex; justify-content: space-between; font: 600 10px/12px var(--font-sans); }
  .body { top: 28px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; }
  .ell { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow { flex: 1; min-width: 0; }
  .sub { font: var(--type-caption); color: var(--text-2); display: block; text-transform: none; letter-spacing: 0; }
  .card { display: flex; align-items: center; gap: 7px; padding: 8px; border-radius: var(--r-lg); }
  .card .t-strong { font-size: 12px; }
  .card .btn { height: 26px; padding: 0 10px; font-size: 11px; }
  .nrow { display: flex; align-items: center; gap: 7px; padding: 7px 8px; }
  .nrow + .nrow { border-top: 1px solid var(--line); }
  .nrow .t-label { font-size: 11px; }
  .tk { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-3); flex: none; }
  .tb { left: 6px; right: 6px; bottom: 6px; display: flex; padding: 3px; border-radius: var(--r-xl); }
  .tb > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 3px; border-radius: var(--r-md); font: var(--type-caption); font-size: 8px; letter-spacing: -.01em; text-transform: none; color: var(--text-2); }
  .tb > .on { background: var(--accent-soft); color: var(--accent); }
  svg.i { display: block; flex: none; }
</style>
</head>
