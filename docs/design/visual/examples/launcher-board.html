<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher board</title>
<!--
  The same launcher window in four levels of see-through, over a busy desktop.
  Each variant only changes the glass tokens. Nothing here is decided. See ../glass.md.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: 4px; }
  .page h1 { font: var(--type-heading); margin: 0 0 2px; }
  .page h2 { font: var(--type-heading); margin: 18px 0 2px; }
  .page p.d { font: var(--type-label); color: var(--text-2); margin: 0 0 8px; max-width: 90ch; }
  .pair { display: grid; grid-template-columns: 600px 600px; gap: 20px; }
  .frame { position: relative; width: 600px; height: 400px; border-radius: 12px; overflow: hidden; color: var(--text); }
  .win { position: absolute; left: 20px; top: 35px; width: 560px; height: 330px; display: flex; flex-direction: column; overflow: hidden; }
  .search { flex: none; display: flex; align-items: center; gap: var(--s-3); height: 52px; padding: 0 var(--pad); }
  .body { flex: 1; min-height: 0; padding: var(--s-2); display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .foot { flex: none; height: 40px; padding: 0 var(--pad); display: flex; align-items: center; gap: var(--s-3); border-top: 1px solid var(--line); }
  .foot .sp { flex: 1; }
  .hint { display: inline-flex; align-items: center; gap: 6px; font: var(--type-label); color: var(--text-2); }
  .avatar.sm { width: 22px; height: 22px; font: var(--type-caption); }

  /* Stand-in applications: hard-coded neutral colours on purpose. */
  .app { position: absolute; border-radius: 8px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .app .tb { height: 18px; background: #3a3d42; }
  .ed { left: 8px; top: 10px; width: 330px; height: 250px; background: #f4f4f2; }
  .ed .ln { height: 5px; margin: 7px 10px; border-radius: 3px; background: #8d9096; }
  .ed .ln.k { background: #2f6fbd; } .ed .ln.g { background: #3d9a5b; } .ed .ln.o { background: #c9792a; }
  .br { left: 270px; top: 70px; width: 320px; height: 300px; background: #ffffff; }
  .br .tb { background: #d8dadd; }
  .br .blocks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px; }
  .br .blocks i { height: 44px; border-radius: 4px; }
  .br .photo { margin: 0 8px; height: 90px; border-radius: 6px; background: linear-gradient(135deg, #ff8a3d, #d6336c 45%, #3b5bdb); }
  .te { left: 30px; top: 230px; width: 300px; height: 160px; background: #14161a; }
  .te .tb { background: #2a2d33; }
  .te .ln { height: 5px; margin: 7px 10px; border-radius: 3px; background: #d9dde3; }
  .te .ln.p { background: #6ee7a0; }

  /* A. Solid */
  .v-solid { --glass-thick: light-dark(rgba(255,255,255,.92), rgba(30,33,40,.92)); --glass-blur: 40px; --glass-saturate: 140%; }
  /* B. Thick glass: the token defaults. */
  .v-thick { --glass-thick: light-dark(rgba(255,255,255,.74), rgba(30,33,40,.72)); --glass-blur: 24px; --glass-saturate: 170%; }
  /* C. Clear glass */
  .v-clear { --glass-thick: light-dark(rgba(255,255,255,.5), rgba(30,33,40,.46)); --glass-blur: 20px; --glass-saturate: 180%; }
  /* D. Thin glass */
  .v-thin { --glass-thick: light-dark(rgba(255,255,255,.26), rgba(30,33,40,.24)); --glass-blur: 12px; --glass-saturate: 190%; }
</style>
</head>
<body class="va">
<div class="page" id="page"></div>
<script>
  var lines = function (n, cls) { var s = ''; for (var i = 0; i < n; i++) s += '<div class="ln ' + (cls[i % cls.length]) + '" style="width:' + (30 + (i * 37) % 60) + '%"></div>'; return s; };
  var desktop =
    '<div class="app ed"><div class="tb"></div>' + lines(26, ['', 'k', '', 'g', '', '', 'o']) + '</div>' +
    '<div class="app br"><div class="tb"></div><div class="blocks"><i style="background:#e03131"></i><i style="background:#2f9e44"></i><i style="background:#1971c2"></i><i style="background:#f08c00"></i><i style="background:#7048e8"></i><i style="background:#0c8599"></i></div><div class="photo"></div><div class="blocks"><i style="background:#212529"></i><i style="background:#adb5bd"></i><i style="background:#e64980"></i></div></div>' +
    '<div class="app te"><div class="tb"></div>' + lines(12, ['p', '', '', 'p', '']) + '</div>';
  var win =
    '<div class="win glass-thick">' +
    '<div class="search"><span class="ico"></span><span class="t-3">Search commands, views and applications</span></div>' +
    '<hr class="divider"><div class="body">' +
    '<div class="row is-selected"><span class="ico"></span><span class="grow">Clipboard history <span class="t-label t-2">Search what you copied</span></span><span class="kbd">Ctrl ⇧ V</span></div>' +
    '<div class="row"><span class="ico"></span><span class="grow">Ask Juno <span class="t-label t-2">Type or speak a request</span></span><span class="kbd">Tab</span></div>' +
    '<div class="row"><span class="ico"></span><span class="grow">Set a timer <span class="t-label t-2">Start a countdown</span></span><span class="kbd">Ctrl T</span></div>' +
    '<div class="row"><span class="ico"></span><span class="grow">Notifications <span class="t-label t-2">3 new</span></span><span class="kbd">Ctrl N</span></div>' +
    '<div class="row"><span class="ico"></span><span class="grow">Firefox <span class="t-label t-2">Application</span></span></div>' +
    '</div><div class="foot"><span class="avatar sm">A</span><span class="t-label">Alex</span>' +
    '<span class="chip success"><span class="dot"></span>Online</span><span class="sp"></span>' +
    '<span class="hint"><span class="kbd">↵</span>Open</span><span class="hint"><span class="kbd">Esc</span>Close</span></div></div>';
  var vs = [
    ['v-solid', 'A. Solid', 'The easiest to read over any desktop, but it hardly looks like glass: only a hint of colour comes through.'],
    ['v-thick', 'B. Thick glass (as first drawn)', 'Text stays easy to read and the desktop still shows softly; a good middle, a little busy over sharp content.'],
    ['v-clear', 'C. Clear glass', 'Looks clearly like glass, but text over bright or busy parts of the desktop starts to lose contrast.'],
    ['v-thin', 'D. Thin glass', 'The desktop is clearly visible and it is the most like Liquid Glass, but text is hard to read over busy windows.']
  ];
  document.getElementById('page').innerHTML = '<h1>Launcher board</h1><p class="d">The same launcher in four levels of see-through, over a busy desktop. Only the glass tokens change. Nothing is decided.</p>' +
    vs.map(function (v) {
      return '<h2>' + v[1] + '</h2><p class="d">' + v[2] + '</p><div class="pair">' +
        ['light', 'dark'].map(function (t) { return '<div class="frame wallpaper compact ' + t + ' ' + v[0] + '">' + desktop + win + '</div>'; }).join('') + '</div>';
    }).join('');
</script>
</body>
</html>
