<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readability board</title>
<!--
  The current glass fails the 4.5 to 1 text contrast. Four ways to fix it, against the current state.
  Each design only overrides token values (and, in D and E, a few rules). Contrast figures are measured worst cases.
  Nothing here is decided. See ../glass.md.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: 4px; }
  .page h2 { font: var(--type-heading); margin: 16px 0 2px; }
  .page h2:first-child { margin-top: 0; }
  .page p.d { font: var(--type-label); color: var(--text-2); margin: 0 0 8px; max-width: 90ch; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cap { font: var(--type-caption); color: var(--text-2); margin: 0 0 4px; }
  .scene { border-radius: 20px; padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; overflow: hidden; align-content: start; }
  .scene .bar { grid-column: 1 / -1; }
  .scene .surface { align-self: start; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .acc { color: var(--accent); font: var(--type-strong); display: inline-block; margin-bottom: 8px; }
  table.m { width: 100%; border-collapse: collapse; margin-top: 6px; font: var(--type-label); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
  table.m th, table.m td { text-align: left; padding: 3px 10px; border-bottom: 1px solid var(--line); }
  table.m tr:last-child td { border-bottom: 0; }
  table.m th { font: var(--type-caption); color: var(--text-2); }
  table.m .no { color: var(--danger); font: var(--type-strong); }
  table.m .yes { font: var(--type-strong); }

  /* The plate wrapper is invisible except in E. */
  .plate { display: contents; }

  /* B. Thicker glass. */
  .v-b { --glass: light-dark(rgba(255,255,255,.62), rgba(34,37,45,.66)); --glass-thick: light-dark(rgba(255,255,255,.76), rgba(30,33,40,.78));
    --text-2: light-dark(rgba(20,22,26,.76), rgba(242,244,247,.78)); }
  /* C. Calmer backdrop. */
  .v-c { --backdrop-1: 32%; --backdrop-2: 20%; --text-2: light-dark(rgba(20,22,26,.76), rgba(242,244,247,.78)); }
  /* D. Thin glass, firmer text, solid chips, Graphite backdrop from its grey. */
  .v-d { --text-2: light-dark(rgba(20,22,26,.80), rgba(242,244,247,.82)); }
  .v-d .glass .chip, .v-d .glass .acc { background: var(--glass-solid); }
  .v-d .glass .acc { padding: 2px 10px; border-radius: var(--r-full); }
  /* E. A plate under the text. */
  .v-e { --text-2: light-dark(rgba(20,22,26,.74), rgba(242,244,247,.76)); }
  .v-e .glass .chip, .v-e .glass .acc { background: var(--glass-solid); }
  .v-e .glass .acc { padding: 2px 10px; border-radius: var(--r-full); }
  .v-e .glass.bar, .v-e .glass.card { padding: 5px; }
  .v-e .plate { display: block; background: light-dark(rgba(255,255,255,.72), rgba(34,37,45,.72)); border-radius: var(--r-md); padding: calc(var(--pad) - 5px); }
  .v-e .bar .plate { display: flex; align-items: center; gap: var(--s-3); flex: 1; padding: var(--s-2) calc(var(--pad) - 5px); }
  .v-d.accent-graphite, .v-e.accent-graphite { background:
    radial-gradient(60% 70% at 10% 12%, color-mix(in srgb, var(--accent-2) var(--backdrop-1), transparent) 0, transparent 70%),
    radial-gradient(55% 65% at 94% 24%, color-mix(in srgb, var(--accent-2) var(--backdrop-1), transparent) 0, transparent 70%),
    radial-gradient(70% 60% at 55% 108%, color-mix(in srgb, var(--accent-2) var(--backdrop-2), transparent) 0, transparent 70%),
    var(--bg); }
</style>
</head>
<body class="va">
<div class="page" id="page"></div>
<script>
  var inner =
    '<div class="glass bar"><div class="plate"><span class="ico"></span><span class="t-strong" style="flex:1">Home</span><span class="chip success"><span class="dot"></span>Online</span><span class="avatar" style="width:28px;height:28px">A</span></div></div>' +
    '<div class="glass card"><div class="plate"><div class="card-head"><span class="character listening" style="--size:40px"></span>' +
    '<span style="flex:1"><span class="t-strong" style="display:block">Juno</span><span class="t-label t-2">Listening…</span></span></div>' +
    '<div class="t-caption">Pasta timer</div><div class="t-display num">07:42</div>' +
    '<div class="tags"><span class="chip success">Done</span><span class="chip warning">Low battery</span><span class="chip danger">Offline</span></div>' +
    '<span class="acc">Open the shopping list</span>' +
    '<div class="actions"><span class="btn btn-primary">Stop</span><span class="btn">Snooze</span></div></div></div>' +
    '<div class="surface list" style="padding:6px">' +
    '<div class="row is-selected"><span class="ico"></span><span class="grow">Parcel arrives tomorrow<span class="sub">Email · 2 min ago</span></span></div>' +
    '<div class="row"><span class="ico"></span><span class="grow">Milk added to Shopping<span class="sub">Lists · 18 min ago</span></span></div>' +
    '<div class="row"><span class="ico"></span><span class="grow">Listen for the wake word</span><span class="toggle on"></span></div></div>';

  // [value text, lowest value]
  var vs = [
    ['v-a', 'A. As now (reference, not a choice)', 'No changes: this is the measured state, and it fails.',
      [['6.4',6.4],['3.4',3.4],['1.8 to 2.6',1.8]], [['3.6',3.6],['2.5',2.5],['1.4 to 2.3',1.4]]],
    ['v-b', 'B. Thicker glass', 'Gain: simple. Cost: less like glass; coloured text still fails.',
      [['10.7',10.7],['6.1',6.1],['3.0 to 3.5',3.0]], [['7.4',7.4],['5.2',5.2],['2.9 to 4.7',2.9]]],
    ['v-c', 'C. Calmer backdrop', 'Gain: glass stays thin. Cost: much less colour on screen; coloured text still fails in places.',
      [['11.0',11.0],['6.2',6.2],['3.0 to 3.5',3.0]], [['7.9',7.9],['5.6',5.6],['3.1 to 5.1',3.1]]],
    ['v-d', 'D. Thin glass, firmer text', 'Gain: keeps the chosen look. Cost: secondary text in dark still falls short.',
      [['8.6',8.6],['5.8',5.8],['5.0 to 5.4',5.0]], [['4.7',4.7],['3.8',3.8],['5.4 to 8.8',5.4]]],
    ['v-e', 'E. A plate under the text', 'Gain: everything passes and the rim still reads as glass. Cost: a second layer to draw on every glass surface.',
      [['13.6',13.6],['6.6',6.6],['5.0 to 5.4',5.0]], [['9.3',9.3],['6.2',6.2],['5.4 to 8.8',5.4]]]
  ];
  var rows = ['Text', 'Secondary text', 'Coloured text'];
  function table(d) {
    return '<table class="m"><tr><th>Worst case</th><th>Contrast</th><th>Against 4.5</th></tr>' + d.map(function (c, i) {
      var ok = c[1] >= 4.5;
      return '<tr><td>' + rows[i] + '</td><td class="num">' + c[0] + '</td><td class="' + (ok ? 'yes' : 'no') + '">' + (ok ? 'passes' : 'fails') + '</td></tr>';
    }).join('') + '</table>';
  }
  document.getElementById('page').innerHTML = vs.map(function (v) {
    var frames = [['light', 'aurora', v[3], 'Light, Aurora'], ['dark', 'graphite', v[4], 'Dark, Graphite (worst case)']];
    return '<div id="' + v[0] + '"><h2>' + v[1] + '</h2><p class="d">' + v[2] + '</p><div class="pair">' +
      frames.map(function (f) {
        return '<div><p class="cap">' + f[3] + '</p><div class="scene backdrop ' + f[0] + ' accent-' + f[1] + ' ' + v[0] + '">' + inner + '</div>' + table(f[2]) + '</div>';
      }).join('') + '</div></div>';
  }).join('');
</script>
</body>
</html>
