<title>Icons: which set, outlined or filled</title>
<!--
  Four open icon sets, each drawn with its real icons (inlined SVG, no network,
  no icon font) in the same three pieces: the phone tab bar, a settings side
  bar, and twelve everyday icons at 16px and 24px. Nothing here is decided.
  Sources: lucide-static 1.82.0 (ISC), @phosphor-icons/core 2.1.1 (MIT),
  @tabler/icons 3.53.0 (MIT).
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: var(--s-4); }
  .head { display: inline-flex; align-items: center; padding: var(--s-2) var(--s-5); margin-bottom: var(--s-3); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
  .opt { padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-3); min-width: 0; }
  .oh { display: flex; align-items: center; gap: var(--s-3); }
  .big { width: 48px; height: 48px; border-radius: var(--r-md); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: var(--type-display); flex: none; }
  .oh h2 { font: var(--type-heading); }
  .oh .meta { font: var(--type-label); color: var(--text-2); }
  .opt p.d { font: var(--type-label); color: var(--text-2); }
  .pieces { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); align-items: stretch; }
  .lab { font: var(--type-caption); letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); margin-bottom: 4px; display: block; }
  .frame { border-radius: var(--r-lg); overflow: hidden; position: relative; }
  .pf { height: 218px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .pf .fake { flex: 1; }
  .tb { display: flex; padding: 4px; border-radius: var(--r-xl); gap: 2px; }
  .tb > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border-radius: var(--r-md); font: var(--type-caption); font-size: 9px; letter-spacing: -.01em; text-transform: none; color: var(--text-2); }
  .tb > .on { background: var(--accent-soft); color: var(--accent); }
  .side { padding: 8px; display: flex; flex-direction: column; gap: 2px; height: 100%; }
  .side .r { display: flex; align-items: center; gap: var(--s-3); padding: 0 10px; height: 30px; border-radius: var(--r-sm); font: var(--type-label); color: var(--text); }
  .side .r.sel { background: var(--accent-soft); color: var(--accent); }
  .small { padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); }
  .irow { display: flex; align-items: center; gap: 0; justify-content: space-between; color: var(--text); }
  .irow .tag { width: 40px; font: var(--type-caption); color: var(--text-2); flex: none; }
  .irow .icos { flex: 1; display: flex; justify-content: space-between; align-items: center; }
  .irow.s2 { opacity: 1; }
  svg.i { display: block; flex: none; }
  .strip { margin-top: var(--s-3); padding: var(--s-3) var(--s-4); }
  .strip .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-3); }
  .dk { padding: 10px; border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 6px; }
  .dk .lab { color: var(--text-2); margin: 0; }
</style>
</head>
