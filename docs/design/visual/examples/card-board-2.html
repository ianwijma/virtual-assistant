<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card board, second round</title>
<!--
  Second round of the card board. A card is a compact row by default and a
  touch opens it. Four ways for the row to open, each drawn closed and with
  one card opened, with the same five cards. Nothing here is decided.
  See ../components.md and card-board.html.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: 4px; }
  .grid { display: grid; grid-template-columns: 600px 600px; gap: 0 24px; }
  .arr { margin-bottom: var(--s-5); }
  .arr h2 { font: var(--type-heading); margin: 0 0 2px; }
  .arr p.d { font: var(--type-label); color: var(--text-2); margin: 0 0 var(--s-2); min-height: 54px; }
  .tile { width: 600px; border-radius: 20px; overflow: hidden; box-sizing: border-box; padding: 10px;
    display: grid; grid-template-columns: 285px 285px; gap: 10px; }
  .colwrap .cap { display: block; height: 18px; margin-bottom: 4px; }
  .col { position: relative; height: 548px; display: flex; flex-direction: column; gap: 6px; }
  .col > * { flex: none; }

  /* the row card */
  .rw { display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 8px; box-sizing: border-box; min-width: 0; }
  .sq { width: 36px; height: 36px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .tx { flex: 1; min-width: 0; }
  .t1 { font: var(--type-strong); font-size: 13px; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .t2 { font: var(--type-caption); color: var(--text-2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bt { display: flex; gap: 4px; flex: none; }
  .bt .btn { height: 28px; padding: 0 10px; font-size: 13px; }
  .chev { color: var(--text-3); font-size: 20px; line-height: 1; width: 20px; text-align: center; flex: none; }
  .chev.dn { transform: rotate(90deg); }
  .glass.rw { }

  /* items */
  .check { display: flex; align-items: center; gap: var(--s-2); font: var(--type-label); }
  .box { width: 18px; height: 18px; border-radius: var(--r-xs); border: 1.5px solid var(--text-3); flex: none; display: grid; place-items: center; font-size: 12px; line-height: 1; }
  .box.on { background: var(--accent); border-color: transparent; color: var(--on-accent); }
  .done { text-decoration: line-through; color: var(--text-3); }
  .add { color: var(--text-3); }
  .add .box { border-style: dashed; }

  /* open card */
  .open { display: flex; flex-direction: column; }
  .open .rw { height: 54px; }
  .open .body { border-top: 1px solid var(--line); margin: 0 8px; padding: 10px 0 10px 44px; display: flex; flex-direction: column; gap: 8px; }
  .open .acts { display: flex; gap: 6px; padding: 0 8px 8px; }
  .open .acts .btn { flex: 1; height: 36px; }

  /* B */
  .dim { display: flex; flex-direction: column; gap: 6px; filter: blur(2px); opacity: .5; }
  .ghost { height: 54px; border-radius: var(--r-lg); border: 1.5px dashed var(--line); box-sizing: border-box; }
  .sheet { position: absolute; left: 4px; right: 4px; top: 120px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
  .sheet .hd { display: flex; align-items: center; gap: 8px; }
  .sheet .big { display: flex; flex-direction: column; }
  .sheet .big .check { height: 38px; font: var(--type-body); border-top: 1px solid var(--line); gap: 12px; }
  .sheet .big .check:first-child { border-top: 0; }
  .sheet .box { width: 22px; height: 22px; font-size: 14px; }
  .sheet .acts { display: flex; gap: 8px; }
  .sheet .acts .btn { flex: 1; height: 44px; }

  /* C */
  .swipe { position: relative; height: 54px; }
  .swipe .rw { position: absolute; left: 0; top: 0; bottom: 0; width: calc(100% - 128px); }
  .tiles { position: absolute; right: 0; top: 0; bottom: 0; width: 124px; display: flex; gap: 4px; }
  .tiles span { flex: 1; border-radius: var(--r-lg); display: grid; place-items: center; font: var(--type-caption); font-weight: 600; }
  .t-read { background: var(--accent-soft); color: var(--accent); }
  .t-dis { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }
  .tight { margin: 0 8px 8px 44px; padding: 8px 10px; border-radius: var(--r-md); background: color-mix(in srgb, var(--text) 7%, transparent); display: flex; flex-direction: column; gap: 6px; }
  .hint { font: var(--type-caption); color: var(--text-2); text-align: center; }

  /* D */
  .deck { position: relative; height: 70px; }
  .deck .edge { position: absolute; height: 54px; box-sizing: border-box; }
  .deck .e1 { left: 8px; right: 8px; top: 7px; opacity: .95; }
  .deck .e2 { left: 16px; right: 16px; top: 14px; opacity: .8; }
  .deck .top { position: relative; }
  .cnt { font: var(--type-caption); font-weight: 600; min-width: 22px; height: 22px; border-radius: var(--r-full); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; padding: 0 6px; box-sizing: border-box; }
  .fh { display: flex; align-items: center; justify-content: space-between; height: 18px; padding: 0 4px; font: var(--type-caption); color: var(--text-2); }
  .fan { display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body class="va">
<div class="page"><div class="grid" id="page"></div></div>
<script>
  function ch() { return '<span class="character" style="--size:36px"></span>'; }
  var ico = '<span class="ico"></span>';
  function chk(label, on) { return '<div class="check"><span class="box' + (on ? ' on' : '') + '">' + (on ? '&#10003;' : '') + '</span><span class="' + (on ? 'done' : '') + '">' + label + '</span></div>'; }
  var items = chk('Bread', true) + chk('Milk') + chk('Eggs') + '<div class="check add"><span class="box">+</span>Add an item</div>';
  function chev(dn) { return '<span class="chev' + (dn ? ' dn' : '') + '">&#8250;</span>'; }
  function rw(lead, t, s, btns, cls) {
    return '<div class="rw ' + (cls === undefined ? 'glass' : cls) + '"><span class="sq">' + lead + '</span><span class="tx"><span class="t1">' + t + '</span><span class="t2">' + s + '</span></span>' + (btns ? '<span class="bt">' + btns + '</span>' : '') + '</div>';
  }
  var P = '<span class="btn btn-primary">';
  var cards = {
    timer: function () { return rw(ico, '<span class="num">07:42</span>', 'Pasta timer', P + 'Stop</span>'); },
    email: function () { return rw(ico, 'Parcel arrives tomorrow', 'Email &middot; 2 min ago', chev()); },
    list: function () { return rw(ico, 'Shopping', '2 left of 3', chev()); },
    ask: function () { return rw(ch(), 'Send this to Sam&rsquo;s phone?', 'Juno asks', '<span class="btn btn-primary">Yes</span><span class="btn">No</span>'); },
    rem: function () { return rw(ico, 'Bins go out tonight', 'Reminder &middot; 19:00', '') }
  };
  function stack(over) {
    over = over || {};
    return ['timer', 'email', 'list', 'ask', 'rem'].map(function (k) { return (over[k] || cards[k])(); }).join('');
  }
  function col(cap, html, cls) { return '<div class="colwrap"><span class="t-caption cap">' + cap + '</span><div class="col ' + (cls || '') + '">' + html + '</div></div>'; }

  /* A */
  function A() {
    var open = function () {
      return '<div class="glass open">' + rw(ico, 'Shopping', '2 left of 3', chev(true), '') +
        '<div class="body">' + items + '</div>' +
        '<div class="acts"><span class="btn">Clear ticked</span><span class="btn">Close</span></div></div>';
    };
    return [col('Closed', stack()), col('One opened', stack({ list: open }))];
  }
  /* B */
  function B() {
    var sheet = '<div class="glass-thick sheet"><div class="hd"><span class="sq">' + ico + '</span><span class="tx"><span class="t1">Shopping</span><span class="t2">2 left of 3</span></span><span class="btn btn-quiet btn-icon">&times;</span></div>' +
      '<div class="big">' + items + '</div>' +
      '<div class="acts"><span class="btn">Clear ticked</span><span class="btn btn-primary">Add an item</span></div></div>';
    var behind = '<div class="dim">' + stack({ list: function () { return '<div class="ghost"></div>'; } }) + '</div>';
    return [col('Closed', stack()), col('One lifted', behind + sheet)];
  }
  /* C */
  function C() {
    var swipe = function () {
      return '<div class="swipe"><div class="tiles"><span class="t-read">Read</span><span class="t-dis">Dismiss</span></div>' +
        rw(ico, 'Parcel arrives tomorrow', 'Email &middot; 2 min ago', '') + '</div>';
    };
    var open = function () {
      return '<div class="glass open">' + rw(ico, 'Shopping', '2 left of 3', chev(true), '') + '<div class="tight">' + items + '</div></div>';
    };
    return [col('Closed', stack()), col('Email slid, List opened', stack({ email: swipe, list: open }))];
  }
  /* D */
  function D() {
    var deck = function () {
      return '<div class="deck"><div class="glass edge e2 rw"></div><div class="glass edge e1 rw"></div>' +
        rw(ico, 'Parcel arrives tomorrow', '3 notifications &middot; 2 min ago', '<span class="cnt">3</span>', 'glass top') + '</div>';
    };
    var fan = function () {
      return '<div class="fh"><span>3 notifications</span><span>Close stack</span></div><div class="fan">' +
        rw(ico, 'Parcel arrives tomorrow', 'Email &middot; 2 min ago', chev()) +
        rw(ico, 'Photos from Jo', 'Email &middot; 1 h ago', chev()) +
        rw(ico, 'Your bank statement', 'Email &middot; yesterday', chev()) + '</div>';
    };
    var open = function () {
      return '<div class="glass open">' + rw(ico, 'Shopping', '2 left of 3', chev(true), '') + '<div class="body">' + items + '</div></div>';
    };
    return [col('Closed', stack({ email: deck })), col('Stack fanned, List opened', stack({ email: fan, list: open }))];
  }

  var DESIGNS = [
    ['v-a', 'A. Opens in place', 'tide', 'light', A,
      'Gains the simplest, most discoverable opening, which works the same with a finger or a mouse and gives the card room for content and big buttons; costs a list that jumps, since everything below moves down, and only one card can be open.'],
    ['v-b', 'B. Lifts into a sheet', 'ember', 'dark', B,
      'Gains the most room, since the opened card can hold a whole list with large buttons, and the stack below never jumps; costs a second layer to dismiss and a stack that is hidden while one card is looked at.'],
    ['v-c', 'C. Slides open sideways with actions', 'aurora', 'light', C,
      'Opening shows more and sliding acts quickly, so the common actions need no opening and the list jumps only by what the content needs; costs a gesture that is hidden until learned and awkward with a mouse, so the desktop needs buttons too.'],
    ['v-d', 'D. Grouped stacks', 'moss', 'dark', D,
      'Gains the shortest closed list, since cards of one kind share one row with a deck beneath it, and a stack can be fanned or left alone; costs an extra touch to reach one notification and a list that jumps when a stack fans out.']
  ];
  var h = '';
  DESIGNS.forEach(function (d) {
    h += '<div class="arr" id="' + d[0] + '"><h2>' + d[1] + '</h2><p class="d">' + d[5] + '</p>' +
      '<div class="tile backdrop accent-' + d[2] + ' ' + d[3] + '">' + d[4]().join('') + '</div></div>';
  });
  document.getElementById('page').innerHTML = h;
</script>
</body>
</html>
