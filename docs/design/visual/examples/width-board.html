<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout: by width or by client</title>
<!--
  Does the layout follow the width of the screen, or the kind of client?
  The same settings area (Assistants, Juno, its page) in both options.
  Nothing here is decided. See ../README.md.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: 8px 8px 12px; }
  .page > h1 { font: var(--type-title); margin: 0 0 var(--s-2); }
  .arr { margin-bottom: var(--s-3); }
  .head { display: flex; align-items: center; gap: var(--s-4); margin-bottom: var(--s-2); }
  .letter { width: 48px; height: 48px; border-radius: var(--r-lg); display: grid; place-items: center; flex: none; font: 700 30px/1 var(--font-sans); background: var(--accent); color: var(--on-accent, #fff); }
  .arr h2 { font: 600 18px/22px var(--font-sans); margin: 0; }
  .arr .note { font: 500 13px/17px var(--font-sans); color: var(--text-2); margin: 0; }
  .frames { display: flex; gap: 14px; align-items: flex-start; }
  .cell { flex: none; }
  .cap { display: block; height: 16px; font: var(--type-caption); letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); }
  .under { font: 500 12px/15px var(--font-sans); color: var(--text-2); margin-top: var(--s-1); min-height: 62px; }
  .cost { font: 600 13px/17px var(--font-sans); margin-top: var(--s-2); }

  .frame { position: relative; height: 380px; border-radius: 14px; overflow: hidden; color: var(--text); }
  .win { position: absolute; left: 8px; right: 8px; top: 8px; bottom: 8px; display: flex; overflow: hidden; border-radius: var(--r-lg); }
  .win.tb { bottom: 62px; }
  .win.hold { right: auto; }
  .frame .tabbar { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 4px; }
  .frame .tabbar > * { flex: 1; padding: 6px 0; min-width: 0; font: var(--type-caption); text-transform: none; letter-spacing: 0; gap: 2px; border-radius: var(--r-md, 12px); }
  .frame .tabbar > i { flex: none; width: 1px; padding: 0; background: var(--line); }
  .frame.ic .tabbar > * { font-size: 0; }
  .i { width: 18px; height: 18px; flex: none; display: block; }
  .nav { display: flex; flex-direction: column; gap: 2px; padding: var(--s-2); border-right: 1px solid var(--line); flex: none; }
  .nav .item { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2); border-radius: var(--r-sm); font: var(--type-label); white-space: nowrap; }
  .nav.rail { align-items: center; padding: var(--s-2) 4px; }
  .nav.rail .item { padding: var(--s-2); }
  .nav .item.on { background: var(--accent-soft); font-weight: 600; }
  .nav .search { height: 28px; padding: 0 var(--s-2); gap: var(--s-1); font: var(--type-caption); text-transform: none; letter-spacing: 0; white-space: nowrap; margin-bottom: var(--s-1); }
  .nav .search .caret { display: none; }
  .mid { flex: none; border-right: 1px solid var(--line); padding: var(--s-2); display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
  .mid .hd { font: var(--type-caption); letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); padding: 2px var(--s-2) var(--s-1); }
  .mid .row { min-height: 40px; padding: 0 var(--s-2); gap: var(--s-2); font: var(--type-label); border-radius: var(--r-sm); }
  .mid .row + .row { border-top: 0; }
  .pg { flex: 1; min-width: 0; background: var(--surface); padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); overflow: hidden; }
  .pg.solo { background: transparent; }
  .path { font: var(--type-caption); color: var(--text-2); letter-spacing: 0; text-transform: none; white-space: nowrap; }
  .fld { display: flex; flex-direction: column; gap: 2px; }
  .fld .field { height: 30px; padding: 0 var(--s-2); font: var(--type-label); }
  .tg { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); font: var(--type-label); }
  .topbar { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3); border-radius: var(--r-full); margin-bottom: var(--s-1); font: var(--type-label); }
  .topbar b { font-size: 18px; line-height: 1; font-weight: 500; }
  .hint { position: absolute; left: 8px; right: 8px; bottom: 8px; }
  .hint .chip { width: 100%; justify-content: center; }
  .cut { position: absolute; top: 8px; bottom: 8px; right: 0; width: 36px; background: linear-gradient(90deg, transparent, var(--bg)); pointer-events: none; }
</style>
</head>
<body class="va">

  function ic(n) { return '<svg class="i" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">' + P[n] + '</svg>'; }

  var DEST = [['assistant', 'Assistants'], ['users', 'People'], ['device', 'Devices'], ['mic', 'Voice'], ['gear', 'General']];
  function nav(kind, w) {
    var s = '<div class="nav' + (kind === 'rail' ? ' rail' : '') + '" style="width:' + w + 'px">';
    if (kind === 'full') s += '<div class="search">' + ic('search') + '<span class="t-2">Search settings</span></div>';
    DEST.forEach(function (d, i) {
      s += '<div class="item' + (i === 0 ? ' on' : '') + '" title="' + d[1] + '">' + ic(d[0]) + (kind === 'full' ? d[1] : '') + '</div>';
    });
    return s + '</div>';
  }
  function mid(w) {
    var s = '<div class="mid" style="width:' + w + 'px"><div class="hd">Assistants</div>';
    [['Juno', true], ['Mira'], ['Otto']].forEach(function (a) {
      s += '<div class="row' + (a[1] ? ' is-selected' : '') + '"><span class="avatar" style="width:22px;height:22px;font-size:10px">' + a[0][0] + '</span><span class="grow">' + a[0] + '</span></div>';
    });
    return s + '</div>';
  }
  function page(solo) {
    return '<div class="pg' + (solo ? ' solo' : '') + '"><div><div class="path">Assistants · Juno</div><div class="t-heading">Juno</div></div>' +
      '<div class="fld"><span class="field-label" style="margin:0">Name</span><span class="field">Juno</span></div>' +
      '<div class="fld"><span class="field-label" style="margin:0">Voice</span><span class="field">Warm, slow</span></div>' +
      '<div class="tg"><span>Answers to its name</span><span class="toggle on"></span></div>' +
      '<div class="tg"><span>Quiet at night</span><span class="toggle"></span></div></div>';
  }
  function bar() {
    var s = '<div class="glass-thick tabbar">';
    [['home', 'Home'], ['assistant', 'Juno'], ['timeline', 'Time'], ['chat', 'Chat']].forEach(function (t) { s += '<div>' + ic(t[0]) + t[1] + '</div>'; });
    return s + '<i></i><div class="on">' + ic('all') + 'All</div></div>';
  }
  var BACK = '<div class="glass topbar"><b>‹</b><span class="grow">Assistants</span></div>';

  function narrow(w) {
    return '<div class="frame ' + (w < 190 ? 'ic ' : '') + 'backdrop accent-tide light" style="width:' + w + 'px"><div class="win tb" style="flex-direction:column;background:transparent">' + BACK + page(true) + '</div>' + bar() + '</div>';
  }
  function two(w) {
    return '<div class="frame backdrop accent-tide light compact" style="width:' + w + 'px"><div class="win glass-thick">' + nav('rail', 44) + mid(Math.max(104, Math.round(w * 0.3))) + page() + '</div></div>';
  }
  function three(w, nw, mw) {
    return '<div class="frame backdrop accent-tide light compact" style="width:' + w + 'px"><div class="win glass-thick">' + nav('full', nw) + mid(mw) + page() + '</div></div>';
  }
  function squeezed(w) {
    return '<div class="frame backdrop accent-tide light compact" style="width:' + w + 'px"><div class="win glass-thick hold" style="width:480px">' + nav('full', 124) + mid(120) + page() + '</div><div class="cut"></div>' +
      '<div class="hint"><span class="chip warning"><span class="dot"></span>Scroll sideways to see Juno</span></div></div>';
  }

  function cell(w, cap, html, under) {
    return '<div class="cell" style="width:' + w + 'px"><span class="cap">' + cap + '</span>' + html + '<div class="under">' + under + '</div></div>';
  }
  function arr(id, letter, title, note, cells, cost) {
    return '<div class="arr" id="' + id + '"><div class="head"><span class="letter">' + letter + '</span><div><h2>' + title + '</h2><p class="note">' + note + '</p></div></div>' +
      '<div class="frames">' + cells + '</div><div class="cost">' + cost + '</div></div>';
  }

  var a = cell(200, 'Narrow', narrow(200), 'Under 600: one column at a time, with a back arrow and the tab bar') +
    cell(330, 'Medium', two(330), '600 to 1000: two columns, list and page; destinations collapse to an icon rail') +
    cell(560, 'Wide', three(560, 130, 120), 'Over 1000: three columns');
  var b = cell(170, 'Phone app', narrow(170), 'One column at a time with the tab bar, at any width') +
    cell(290, 'Tablet app', two(290), 'Its own fixed layout: two columns, whatever its width') +
    cell(480, 'Desktop and web', three(480, 120, 110), 'Three columns, at any width') +
    cell(200, 'Narrow browser window', squeezed(200), 'Still the three columns, squeezed or cut off');

  document.getElementById('page').innerHTML =
    '<h1>Layout: by width or by client</h1>' +
    arr('v-a', 'A', 'The layout follows the width.',
      'A narrow browser window gets the narrow layout; a wide tablet gets three columns. The phone, tablet, desktop and web share one set of layouts.', a,
      'Costs: each screen is built to fold three ways, and a phone held sideways changes layout.') +
    arr('v-b', 'B', 'The layout follows the client.',
      'Each client has one fixed layout. Simpler to build per client; a narrow window or a wide tablet does not adapt.', b,
      'Costs: a narrow browser window or a wide tablet is left with a layout that does not fit it.');
</script>
</body>
</html>
