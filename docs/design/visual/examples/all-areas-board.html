<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All areas on every client</title>
<!--
  The overview of all areas and the settable bar were chosen on the phone only.
  How do they carry to a wider app and to the desktop launcher? The narrow
  frame is the same in every option. Nothing here is decided. See ../phone.md.
-->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: 8px 8px 12px; }
  .page > h1 { font: var(--type-title); margin: 0 0 var(--s-1); }
  .page > .lead { font: var(--type-label); color: var(--text-2); margin: 0 0 var(--s-3); }
  .arr { margin-bottom: var(--s-4); }
  .head { display: flex; align-items: center; gap: var(--s-4); margin-bottom: var(--s-2); }
  .letter { width: 48px; height: 48px; border-radius: var(--r-lg); display: grid; place-items: center; flex: none; font: 700 30px/1 var(--font-sans); background: var(--accent); color: var(--on-accent); }
  .arr h2 { font: 600 18px/22px var(--font-sans); margin: 0; }
  .arr .note { font: 500 13px/17px var(--font-sans); color: var(--text-2); margin: 0; }
  .frames { display: flex; gap: 20px; align-items: flex-start; }
  .cap { display: block; height: 16px; font: var(--type-caption); letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); }
  .frame { position: relative; height: 340px; border-radius: 14px; overflow: hidden; color: var(--text); }
  .i { display: block; flex: none; }
  .ell { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font: var(--type-caption); letter-spacing: 0; text-transform: none; color: var(--text-2); display: block; }

  /* narrow phone */
  .n .top { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; align-items: center; gap: var(--s-2); padding: 6px 10px; border-radius: var(--r-full); font: var(--type-label); font-weight: 600; }
  .n .scr { position: absolute; top: 56px; left: 8px; right: 8px; bottom: 66px; overflow: hidden; }
  .n .nrow { display: flex; align-items: center; gap: var(--s-2); padding: 8px 10px; font: var(--type-label); }
  .n .nrow + .nrow { border-top: 1px solid var(--line); }
  .dim { position: absolute; inset: 0; background: color-mix(in srgb, var(--text) 30%, transparent); z-index: 3; }
  .tb { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 1px; padding: 4px; border-radius: var(--r-xl); z-index: 6; }
  .tb > div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0; border-radius: var(--r-md); font: var(--type-caption); font-size: 7.5px; letter-spacing: 0; text-transform: none; color: var(--text-2); }
  .tb > div > span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb > .on { background: var(--accent-soft); color: var(--text); }
  .tb > .sep { flex: none; flex-basis: 1px; width: 1px; height: 28px; align-self: center; padding: 0; background: var(--line); }
  .sheet { position: absolute; z-index: 4; padding: var(--s-2); }
  .n .sheet { left: 8px; right: 8px; bottom: 66px; }
  .grab { width: 30px; height: 4px; border-radius: 2px; background: var(--text-3); margin: 0 auto 6px; }
  .sh { display: flex; align-items: center; margin-bottom: var(--s-2); }
  .sh .t-heading { flex: 1; font-size: 14px; }
  .btn.sm { height: 24px; padding: 0 10px; font-size: 11px; border-radius: var(--r-sm); }
  .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 2px; }
  .gi { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
  .gi .bx { width: 38px; height: 38px; border-radius: var(--r-md); background: var(--control); display: grid; place-items: center; }
  .gi.mine .bx { background: var(--accent-soft); }
  .gi .t-label { font-size: 9px; line-height: 11px; font-weight: 500; text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n .g { gap: 6px 0; }
  .n .gi .bx { width: 34px; height: 34px; }
  .n .gi .t-label { font-size: 8.5px; }

  /* wide app */
  .win { position: absolute; left: 8px; right: 8px; top: 8px; bottom: 8px; display: flex; overflow: hidden; border-radius: var(--r-lg); }
  .nav { flex: none; display: flex; flex-direction: column; gap: 2px; padding: var(--s-2) 6px; border-right: 1px solid var(--line); }
  .nav.rail { width: 48px; align-items: center; }
  .nav.side { width: 148px; }
  .nav .it { display: flex; align-items: center; gap: var(--s-2); padding: 6px; border-radius: var(--r-sm); font: var(--type-label); white-space: nowrap; color: var(--text); }
  .nav .it.on { background: var(--accent-soft); font-weight: 600; }
  .nav .gap { flex: 1; }
  .nav hr { border: 0; height: 1px; background: var(--line); margin: 4px 2px; width: 100%; }
  .nav .dv { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .nav .dv hr { flex: 1; margin: 0; }
  .nav .pen { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--control); flex: none; }
  .pg { flex: 1; min-width: 0; background: var(--surface); padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); overflow: hidden; }
  .pg .row { min-height: 36px; border-radius: var(--r-sm); padding: 0 var(--s-2); }
  .tall { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2); }
  .w .sheet { left: 64px; bottom: 14px; width: 252px; }
  .w .menu { left: 64px; bottom: 14px; width: 196px; padding: 6px; }
  .mrow { display: flex; align-items: center; gap: var(--s-2); height: 27px; padding: 0 var(--s-2); font: var(--type-label); border-radius: var(--r-xs); }
  .mrow.mine { background: var(--accent-soft); }
  .mh { display: flex; align-items: center; padding: 2px 4px 6px var(--s-2); }
  .mh .t-heading { flex: 1; font-size: 14px; }
  .mrow .sp { flex: 1; }

  /* launcher */
  .l .lw { position: absolute; left: 14px; right: 14px; top: 10px; display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-xl); }
  .lh { display: flex; align-items: center; gap: var(--s-2); height: 42px; padding: 0 var(--pad); flex: none; }
  .lh .caret { width: 2px; height: 15px; background: var(--accent); }
  .lb { padding: var(--s-2); display: flex; flex-direction: column; gap: 1px; }
  .lcap { font: var(--type-caption); letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); padding: 2px var(--s-2) 0; }
  .lf { display: flex; align-items: center; gap: var(--s-3); height: 30px; padding: 0 var(--pad); border-top: 1px solid var(--line); flex: none; font: var(--type-caption); color: var(--text-2); }
  .lf .sp { flex: 1; }
  .lr { display: flex; align-items: center; gap: var(--s-2); height: 24px; padding: 0 var(--s-2); border-radius: var(--r-sm); font: var(--type-label); }
  .lr.sel { background: var(--accent-soft); }
  .lr .sp { flex: 1; }
  .l .g { padding: 0 var(--s-1); gap: 4px 2px; }
  .l .gi .bx { width: 36px; height: 36px; }
  .chs { display: flex; gap: 4px; padding: 0 var(--s-2) var(--s-1); }
  .chs .chip { flex: 1; min-width: 0; padding: 0 6px; gap: 4px; justify-content: center; color: var(--text); }
  .chs .chip.all { flex: none; background: var(--accent-soft); font-weight: 600; }
  .chs .chip span { overflow: hidden; text-overflow: ellipsis; }
  .cost { font: 600 13px/17px var(--font-sans); margin-top: var(--s-2); }
</style>
</head>

    return '<div class="pg"><div class="t-heading">Overview</div>' +
      '<div class="glass tall"><span class="character" style="--size:34px"></span><div style="flex:1;min-width:0"><div class="t-strong">Talk to Juno</div><span class="sub">Tap or say &ldquo;Hey Juno&rdquo;</span></div></div>' +
      '<div class="list"><div class="row">' + ic('timer', 16) + '<span class="grow">Pasta timer</span><span class="num t-strong">07:42</span></div>' +
      '<div class="row">' + ic('bell', 16) + '<span class="grow ell">Parcel arrives tomorrow</span></div>' +
      '<div class="row">' + ic('lists', 16) + '<span class="grow">Shopping, 2 left</span></div></div></div>';
  }
  function item(a, on, label) { return '<div class="it' + (on ? ' on' : '') + '" title="' + a[1] + '">' + ic(a[0], 18) + (label ? a[1] : '') + '</div>'; }
  function rail(allOn) {
    return '<div class="nav rail">' + MINE.map(function (a, i) { return item(a, i === 0 && !allOn, false); }).join('') +
      '<hr><div class="it' + (allOn ? ' on' : '') + '" title="All">' + ic('all', 18) + '</div><div class="gap"></div></div>';
  }
  function wideA() {
    return '<div class="frame w backdrop accent-tide light compact" style="width:480px"><div class="win glass-thick">' + rail(true) + page() + '</div>' +
      '<div class="glass-thick sheet">' + sheetHead('All areas') + grid(AREAS, { mark: true, s: 20 }) + '</div></div>';
  }
  function wideB() {
    var s = '<div class="nav side">' + MINE.map(function (a, i) { return item(a, i === 0, true); }).join('') +
      '<div class="dv"><hr><span class="pen" title="Edit">' + ic('pen', 14) + '</span></div>' +
      REST.map(function (a) { return item(a, false, true); }).join('') + '</div>';
    return '<div class="frame w backdrop accent-tide light compact" style="width:480px"><div class="win glass-thick">' + s + page() + '</div></div>';
  }
  function wideC() {
    var m = '<div class="glass-thick menu"><div class="mh"><div class="t-heading">All areas</div><span class="btn btn-quiet sm">Edit</span></div>' +
      AREAS.map(function (a, i) { return '<div class="mrow' + (i < 4 ? ' mine' : '') + '">' + ic(a[0], 16) + '<span class="sp">' + a[1] + '</span></div>'; }).join('') + '</div>';
    return '<div class="frame w backdrop accent-tide light compact" style="width:480px"><div class="win glass-thick">' + rail(true) + page() + '</div>' + m + '</div>';
  }

  /* launcher */
  var PH = '<span class="caret"></span><span class="t-3" style="white-space:nowrap">Search areas, commands and applications</span>';
  function lhead() { return '<div class="lh">' + ic('search', 16) + PH + '</div><hr class="divider">'; }
  function lfoot() { return '<div class="lf"><span class="kbd">&crarr;</span> Open<span class="sp"></span><span class="kbd">Ctrl K</span> Actions</div>'; }
  function lwin(inner) { return '<div class="frame l wallpaper compact light" style="width:420px"><div class="lw glass-thick">' + inner + '</div></div>'; }
  function lrow(a, sel, tag) { return '<div class="lr' + (sel ? ' sel' : '') + '">' + ic(a[0], 16) + '<span class="sp">' + a[1] + '</span>' + (tag ? '<span class="sub">' + tag + '</span>' : '') + '</div>'; }
  function launchA() {
    return lwin(lhead() + '<div class="lb"><div class="lcap">Your four</div>' + grid(MINE, { s: 18 }).replace('class="g"', 'class="g mark"').replace(/class="gi"/g, 'class="gi mine"') +
      '<div class="lcap" style="margin-top:6px">More areas</div>' + grid(REST, { s: 18 }) + '</div>' + lfoot());
  }
  function launchB() {
    return lwin(lhead() + '<div class="lb"><div class="lcap">Pinned</div>' + MINE.map(function (a, i) { return lrow(a, i === 0); }).join('') +
      '<div class="lcap">More areas</div>' + REST.map(function (a) { return lrow(a); }).join('') + '</div>' + lfoot());
  }
  function launchC() {
    var chips = MINE.map(function (a) { return '<span class="chip">' + ic(a[0], 12) + '<span>' + a[1] + '</span></span>'; }).join('') +
      '<span class="chip all">' + ic('all', 12) + '<span>All</span></span>';
    var list = [['assistant', 'Ask Juno', 'Tab'], ['timer', 'Set a timer', ''], ['clip', 'Clipboard history', 'Ctrl Shift V'], ['bell', 'Notifications', '3 new'], ['lists', 'Shopping', '2 left']];
    return lwin(lhead() + '<div class="lb" style="padding-bottom:0"><div class="chs">' + chips + '</div><div class="lcap">Suggestions</div>' +
      list.map(function (a, i) { return lrow(a, i === 0, a[2]); }).join('') + '</div>' + lfoot());
  }

  function cell(w, cap, html) { return '<div class="cell" style="width:' + w + 'px"><span class="cap">' + cap + '</span>' + html + '</div>'; }
  function arr(id, letter, title, note, wide, launch) {
    return '<div class="arr" id="' + id + '"><div class="head"><span class="letter">' + letter + '</span><div><h2>' + title + '</h2><p class="note">' + note + '</p></div></div>' +
      '<div class="frames">' + cell(200, 'Narrow phone, All open', narrow()) + cell(480, 'Medium and wide app', wide) + cell(420, 'Desktop launcher', launch) + '</div></div>';
  }
  document.getElementById('page').className = 'page accent-tide light';
  document.getElementById('page').innerHTML =
    '<h1>All areas on every client</h1><p class="lead">How does the overview of all areas, and choosing your own four, carry to wider screens and the desktop? The narrow phone is as chosen and is the same in every option.</p>' +
    arr('v-a', 'A', 'The same grid everywhere.', 'One thing to learn. On a wide screen a sheet hides areas that would have fitted in the side bar.', wideA(), launchA()) +
    arr('v-b', 'B', 'The side bar is the overview.', 'Uses the room a wide screen has. The All button exists only on narrow screens.', wideB(), launchB()) +
    arr('v-c', 'C', 'Four and All everywhere, shown as each surface does.', 'Same idea, three shapes. More to design and build.', wideC(), launchC());
</script>
</body>
</html>
