<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin panel mockups</title>
<link rel="stylesheet" href="../examples/tokens.css"><link rel="stylesheet" href="../examples/components.css"><link rel="stylesheet" href="mockup.css">
<style>
body { background: var(--bg); }
.app { position: absolute; inset: 0; display: flex; gap: 12px; padding: 12px; }
.side { width: 230px; flex: none; display: flex; flex-direction: column; padding: var(--s-3); gap: var(--s-1); }
.brand { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-1) var(--s-2) var(--s-2); }
.brand .logo { width: 28px; height: 28px; border-radius: var(--r-sm); background: linear-gradient(160deg, var(--accent-2), var(--accent)); }
.nav-cap { padding: var(--s-2) var(--s-2) 2px; }
.nav { display: flex; align-items: center; gap: var(--s-2); height: 30px; padding: 0 var(--s-2); border-radius: var(--r-sm); font: var(--type-label); color: var(--text); }
.nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.me { margin-top: auto; display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2); border-top: 1px solid var(--line); }
.me .avatar { width: 28px; height: 28px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-3) 0 var(--s-4); height: 52px; flex: none; }
.top .grow { flex: 1; }
.top .field { width: 220px; }
.content { flex: 1; min-height: 0; overflow: hidden; padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-4); }
.sec-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s-2); }
.tbl .row { display: grid; grid-template-columns: var(--cols); gap: var(--s-3); align-items: center; }
.tbl .head { font: var(--type-caption); letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); min-height: 28px; }
.tbl .head + .row { border-top: 1px solid var(--line); }
.cell-who { display: flex; align-items: center; gap: var(--s-2); min-width: 0; }
.cell-who .avatar { width: 26px; height: 26px; }
.wait { background: var(--accent-soft); border-radius: var(--r-md); }
.btn-sm { height: 26px; padding: 0 var(--s-3); }
.split { flex: 1; min-height: 0; display: flex; gap: 12px; }
.preview { width: 250px; flex: none; padding: var(--s-4); display: flex; flex-direction: column; align-items: center; gap: var(--s-3); text-align: center; align-self: flex-start; }
.form { flex: 1; min-width: 0; overflow: hidden; padding: var(--s-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-5); align-content: start; }
.fcol { display: flex; flex-direction: column; gap: var(--s-3); min-width: 0; }
.fgroup { display: flex; flex-direction: column; gap: var(--s-2); }
.fgroup > h3 { font: var(--type-heading); padding-bottom: var(--s-1); border-bottom: 1px solid var(--line); }
.area { height: 76px; align-items: flex-start; padding-top: var(--s-2); }
.sw { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); flex: none; }
.sw.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.sw-row { display: flex; gap: var(--s-4); }
.sw-item { display: flex; flex-direction: column; align-items: center; gap: var(--s-1); }
.two { display: flex; gap: var(--s-4); flex: 1; min-height: 0; }
.two > .surface { flex: 1; }
.upload { height: 90px; border: 1.5px dashed var(--line); border-radius: var(--r-md); display: grid; place-items: center; color: var(--text-2); font: var(--type-label); }
.reqs { width: 380px; flex: none; border-right: 1px solid var(--line); padding: var(--s-2); }
.reqs .row { display: grid; grid-template-columns: 44px 1fr 56px; gap: var(--s-2); min-height: 48px; }
.detail { flex: 1; padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); }
.step { display: grid; grid-template-columns: 150px 1fr 70px; gap: var(--s-3); align-items: center; min-height: 40px; }
.track { position: relative; height: 12px; border-radius: var(--r-full); background: var(--surface-2); }
.bar-fill { position: absolute; top: 0; bottom: 0; border-radius: var(--r-full); background: var(--accent); }
.filters { display: flex; align-items: center; gap: var(--s-2); }
.sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 560px; padding: var(--s-8); display: flex; flex-direction: column; gap: var(--s-4); }
.steps { display: flex; justify-content: space-between; gap: var(--s-1); }
.stp { display: flex; align-items: center; gap: 6px; font: var(--type-caption); color: var(--text-2); }
.stp i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; background: var(--control); }
.stp.on { color: var(--text); }
.stp.on i { background: var(--accent); color: var(--on-accent); }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.phone .app { flex-direction: column; padding: 12px; }
.phone .top { height: 48px; padding: 0 var(--s-2) 0 var(--s-4); }
.phone .tabs { display: flex; justify-content: space-around; padding: var(--s-2); flex: none; }
.phone .tabs > * { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 12px; border-radius: var(--r-md); font: var(--type-caption); color: var(--text-2); }
.phone .tabs > .on { background: var(--accent-soft); color: var(--accent); }
.phone .content { padding: var(--s-2); }
.phone .row { padding: 0 var(--s-2); }
</style></head>

 <div class="notes"><div class="note">Side bar (glass, 230px, 12px inset): household name, navigation groups, signed-in person at the bottom. It is the same on every screen; the current item is tinted with the accent. A member who is not an admin sees only the "My settings" items (their own profile, devices, assistants and accent), not the Household, System or Logs groups.</div><div class="note">Top bar (glass): page title, a search field that filters the list on the page, and the one primary action of the screen.</div><div class="note">"Waiting for approval" shows only when a household device has asked to join. Approve makes it a household device; Reject removes the request. The section is hidden when empty.</div><div class="note">The list is plain and not glass. Status always carries a word and a dot, never colour alone. A row opens that device's settings. Columns: name, kind, owner (a person or Household), status, last seen.</div></div>
