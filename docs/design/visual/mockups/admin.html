<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin panel mockups</title>
<link rel="stylesheet" href="../examples/tokens.css"><link rel="stylesheet" href="../examples/components.css"><link rel="stylesheet" href="mockup.css">
<style>
body { background: var(--bg); }
.shots { display: grid; grid-template-columns: 590px 590px; gap: 28px 20px; align-items: start; }
.frame.mini { width: 590px; height: 400px; border-radius: 12px; }
.in { position: absolute; left: 0; top: 0; width: 738px; height: 500px; zoom: .8; }
.in > * { position: absolute; }
.screen > .notes { max-width: none; }
.grow { flex: 1; min-width: 0; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ico.ic { border: 0; opacity: 1; background: var(--accent-soft); }
.nav { display: flex; align-items: center; gap: var(--s-2); height: 24px; padding: 0 var(--s-2); border-radius: var(--r-sm); font: var(--type-label); color: var(--text); white-space: nowrap; }
.nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav.on .ico.ic { background: var(--accent); }
.cap { padding: var(--s-2) var(--s-2) 2px; }
.col { display: flex; flex-direction: column; gap: var(--s-2); overflow: hidden; }
.grp { display: flex; flex-direction: column; border-radius: var(--r-lg); overflow: hidden; padding: 2px; }
.grp .row { min-height: 34px; border-radius: var(--r-md); }
.row .val { max-width: 55%; color: var(--text-2); }
.chev { color: var(--text-3); font-weight: 600; flex: none; }
mark { background: var(--accent-soft); color: var(--text); border-radius: 3px; padding: 0 1px; }
.person { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2); }
.person .avatar { width: 30px; height: 30px; }
.fld { height: 28px; flex: none; }
.fld .ph { white-space: nowrap; overflow: hidden; }
.caret { display: inline-block; width: 1.5px; height: 15px; background: var(--accent); margin-left: 1px; vertical-align: -3px; }
.head { display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-1); }
.big { min-height: 54px; padding-top: 4px; padding-bottom: 4px; border-radius: var(--r-md); }
.big .sub { font-size: 11px; }
.path { color: var(--text-2); padding: 0 var(--s-1); }
.empty { align-items: center; justify-content: center; text-align: center; gap: var(--s-2); }
.btn { height: 28px; }
.sw { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); flex: none; display: inline-block; }
.sw.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.sw.s { width: 12px; height: 12px; }
.swatches { display: flex; gap: var(--s-4); padding: var(--s-3); }
.swi { display: flex; flex-direction: column; align-items: center; gap: var(--s-1); }
.lrow { min-height: 46px; padding-top: 4px; padding-bottom: 4px; border-radius: var(--r-md); }
.lrow .top { display: flex; align-items: baseline; gap: var(--s-2); }
.tot { font-variant-numeric: tabular-nums; font-weight: 600; flex: none; }
.strip { display: flex; gap: 1px; height: 4px; margin-top: 4px; }
.strip i { display: block; border-radius: 2px; min-width: 1px; }
.n1 { background: color-mix(in srgb, var(--text) 16%, transparent); }
.n2 { background: color-mix(in srgb, var(--text) 28%, transparent); }
.ac { background: var(--accent); }
.wf { display: flex; flex-direction: column; gap: 4px; }
.wf .l { display: flex; gap: var(--s-2); align-items: baseline; }
.track { height: 10px; position: relative; border-radius: 5px; background: color-mix(in srgb, var(--text) 8%, transparent); }
.track i { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.pad { padding: 0 var(--s-1); }
.dots { display: flex; gap: 8px; align-items: center; justify-content: center; }
.dots i { display: block; width: 8px; height: 8px; border-radius: var(--r-full); border: 1.5px solid var(--text-3); box-sizing: border-box; }
.dots i.done { background: var(--accent); border-color: var(--accent); }
.dots i.now { width: 22px; background: var(--accent); border-color: var(--accent); }
.mid { align-items: center; text-align: center; }
.sym { width: 56px; height: 56px; border-radius: var(--r-full); background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex: none; }
.sym .ico { width: 26px; height: 26px; }
.fgrid { display: grid; grid-template-columns: 1fr 84px; gap: var(--s-2) var(--s-3); text-align: left; width: 100%; }
.fgrid .full { grid-column: 1 / -1; }
.fl { display: flex; flex-direction: column; min-width: 0; }
.bigbtn { height: 48px; font-size: 17px; border-radius: var(--r-lg); width: 100%; box-sizing: border-box; }
.link { color: var(--accent); font: var(--type-label); }
.back { font-size: 24px; line-height: 1; color: var(--accent); }
.prev { padding: var(--s-5) var(--s-3); display: flex; flex-direction: column; align-items: center; gap: var(--s-2); }
.formcol { padding: var(--s-3) var(--s-4); overflow: hidden; }
.sec { margin-bottom: var(--s-2); }
.sec > .t-heading { margin-bottom: var(--s-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2) var(--s-3); }
.span2 { grid-column: 1 / -1; }
.field.ta { height: auto; align-items: flex-start; padding: var(--s-2) var(--s-3); }
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.tg .row { padding: 0; min-height: 24px; }
.phone-col .grp .row { min-height: 20px; height: 20px; padding-top: 0; padding-bottom: 0; }
.phone-col { gap: 2px; }
.phone-col .cap { padding-top: 4px; }
.phone-col .topbar { flex: none; }
.topbar { display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-3); }
.phone-col { padding: var(--s-2); gap: var(--s-2); }
</style></head>
<body class="va"><div class="mock-page">
<header><h1>Admin panel</h1><p>The browser application that configures the household. Each screen is drawn at about 1000 by 680 and shown reduced, in compact density, in three columns as decided. Where a screen is not decided, it is drawn as plainly as possible and its note says so.</p></header>
<div class="shots" id="shots"></div>
</div>
<script>
(function () {
  var G = [['Household', ['People', 'Devices', 'Assistants']], ['System', ['AI providers', 'Speech', 'Modules', 'Features']], ['Logs', ['Summoning', 'Requests', 'Admin access', 'Audit']], ['Feedback', ['Feedback']]];
  var IC = '<span class="ico ic"></span>', LENS = '<span class="ico"></span>';
  function at(s) { return ' style="' + s + '"'; }
  function ab(s) { return at(s) + '>'; }
  function ch(size, cls) { return '<span class="character' + (cls ? ' ' + cls : '') + '" style="--size:' + size + 'px"></span>'; }
  function fig(size) { return '<span class="figure" style="--size:' + size + 'px"><span class="character" style="--size:' + size + 'px"></span></span>'; }
  function nav(n, on) { return '<div class="nav' + (on ? ' on' : '') + '">' + IC + n + '</div>'; }
  function navGroups(cur) {
    return G.map(function (g) {
      return (g[0] === 'Feedback' ? '<div style="height:6px"></div>' : '<div class="t-caption cap">' + g[0] + '</div>') + g[1].map(function (n) { return nav(n, n === cur); }).join('');
    }).join('');
  }
  function side(cur, q) {
    var f = q ? '<span class="grow">' + q + '<span class="caret"></span></span>' : '<span class="ph grow">Search settings</span>';
    return '<aside class="glass col"' + ab('left:10px;top:10px;bottom:10px;width:160px;padding:var(--s-2);gap:0') +
      '<div class="field fld">' + LENS + f + '</div><div style="height:6px"></div>' +
      '<div class="person"><span class="avatar">A</span><div class="t-label" style="font-weight:600">Alex &middot; Admin</div></div>' + navGroups(cur) + '</aside>';
  }
  function row(label, val, o) {
    o = o || {};
    return '<div class="row"><span class="ico ic"></span><div class="grow ell">' + label + '</div>' + (val ? '<span class="val ell">' + val + '</span>' : '') + (o.t ? '<span class="toggle on"></span>' : '<span class="chev">&rsaquo;</span>') + '</div>';
  }
  function grp(rows) { return '<div class="grp surface">' + rows.join('') + '</div>'; }
  function bigRow(avatar, title, sub, sel, extra) {
    return '<div class="row big' + (sel ? ' is-selected' : '') + '">' + avatar + '<div class="grow"><div class="t-strong ell">' + title + '</div><div class="sub ell">' + sub + '</div></div>' + (extra || '') + '</div>';
  }
  function av(l) { return '<span class="avatar" style="width:32px;height:32px">' + l + '</span>'; }
  function listCol(title, rows, addLabel, w) {
    return '<section class="col"' + ab('left:180px;top:10px;bottom:10px;width:' + (w || 220) + 'px;gap:2px') +
      '<div class="t-heading" style="padding:var(--s-1) var(--s-2) var(--s-2)">' + title + '</div>' + rows.join('') +
      '<div class="grow"></div>' + (addLabel ? '<span class="btn">' + addLabel + '</span>' : '') + '</section>';
  }
  var PG = 'left:410px;right:10px;top:14px;bottom:10px;padding:0 var(--s-1);gap:var(--s-3)';
  function path(s) { return '<div class="t-label path">' + s + '</div>'; }
  function quiet(title, sub) {
    return '<main class="col empty"' + ab('left:410px;right:10px;top:10px;bottom:10px') + '<div class="t-heading">' + title + '</div><div class="t-label t-2">' + sub + '</div></main>';
  }

  /* 1 Devices */
  function devices() {
    var rows = [
      '<div class="t-caption cap">Waiting for approval</div>',
      bigRow(IC, 'Bedroom tablet', 'Household tablet', 1, '<span class="chip warning"><i class="dot"></i>Waiting</span>'),
      '<div class="t-caption cap">All devices</div>',
      bigRow(IC, 'Alex&rsquo;s laptop', 'Desktop', 0, '<span class="chip success"><i class="dot"></i>Online</span>'),
      bigRow(IC, 'Alex&rsquo;s phone', 'Phone', 0, '<span class="chip success"><i class="dot"></i>Online</span>'),
      bigRow(IC, 'Sam&rsquo;s phone', 'Phone', 0, '<span class="chip"><i class="dot"></i>Offline</span>'),
      bigRow(IC, 'Kitchen tablet', 'Household tablet', 0, '<span class="chip success"><i class="dot"></i>Online</span>'),
      bigRow(IC, 'Hall tablet', 'Household tablet', 0, '<span class="chip"><i class="dot"></i>Offline</span>')
    ];
    return side('Devices') + listCol('Devices', rows, 'Invite a household device', 250) +
      '<main class="col"' + ab(PG.replace('410px', '440px')) + path('Devices &rsaquo; Bedroom tablet') +
      '<div class="head">' + '<span class="ico ic" style="width:44px;height:44px"></span><div><div class="t-title">Bedroom tablet</div><div class="t-label t-2">Asked 4 minutes ago</div></div></div>' +
      grp([row('Kind', 'Household tablet'), row('Invite', 'From Alex'), row('Status', 'Waiting for approval')]) +
      '<div style="display:flex;gap:var(--s-2)"><span class="btn btn-primary">Approve</span><span class="btn">Reject</span></div></main>';
  }

  /* 2 People */
  function people() {
    var P = [['A', 'Alex', 'Admin', 'tide', 'Tide', 3], ['S', 'Sam', 'Member', 'ember', 'Ember', 2], ['J', 'Jo', 'Member', 'aurora', 'Aurora', 1], ['K', 'Kit', 'Member', 'moss', 'Moss', 0]];
    var rows = P.map(function (p, i) { return bigRow(av(p[0]), p[1], p[2], i === 1, '<i class="sw s accent-' + p[3] + '"></i>'); });
    return side('People') + listCol('People', rows, 'Invite a person') +
      '<main class="col"' + ab(PG) + path('People &rsaquo; Sam') +
      '<div class="head"><span class="avatar" style="width:44px;height:44px">S</span><div><div class="t-title">Sam</div><div class="t-label t-2">Member</div></div></div>' +
      grp([row('Email', 'sam@home.example'), row('Role', 'Member'), row('Accent', 'Ember'), row('Devices', '2 devices')]) + '</main>';
  }

  /* 3 Edit an assistant */
  function fld(label, val, extra) { return '<div class="' + (extra || '') + '"><span class="field-label">' + label + '</span><div class="field">' + val + '</div></div>'; }
  function sec(t, b) { return '<div class="sec"><div class="t-heading">' + t + '</div>' + b + '</div>'; }
  function edit() {
    var abil = '<div class="tg">' + [['Lists', 1], ['Timers', 1], ['Notifications', 1], ['Clipboard', 0], ['Email', 0]].map(function (a) { return '<div class="row"><span class="grow">' + a[0] + '</span><span class="toggle' + (a[1] ? ' on' : '') + '"></span></div>'; }).join('') + '</div>';
    return '<div class="glass topbar"' + ab('left:10px;right:10px;top:10px;height:44px') + '<div class="t-heading grow"><span class="t-2">Assistants /</span> Juno</div><span class="btn btn-quiet">Discard</span><span class="btn btn-primary">Save</span></div>' +
      '<aside class="glass prev"' + ab('left:10px;top:64px;width:200px;height:300px') + ch(110, 'listening') + '<div class="t-heading">Juno</div><div class="t-label t-2">Say: Hey Juno</div><span class="chip accent">Household assistant</span></aside>' +
      '<div class="surface formcol"' + ab('left:220px;right:10px;top:64px;bottom:10px') +
      sec('Identity', '<div class="grid2">' + fld('Name', 'Juno') + fld('Wake words', 'Hey Juno') + fld('Voice', 'Warm, calm (local)') + fld('Language', 'English (UK)') + '</div>') +
      '<div class="grid2"><div>' + sec('Brain', fld('AI provider', 'Local model (small)')) + '</div><div>' + sec('Scope', '<div class="segmented"><span class="on">Household</span><span>One person</span></div>') + '</div></div>' +
      '<div class="grid2"><div>' + sec('Abilities', abil) + '</div><div>' + sec('Guest', '<div class="row" style="padding:0"><span class="grow">Answers guests</span><span class="toggle on"></span></div>') +
      sec('Devices it is on', '<div class="chips"><span class="chip">Kitchen tablet</span><span class="chip">Alex&rsquo;s phone</span><span class="chip accent">+ Add a device</span></div>') + '</div></div></div>';
  }

  /* 4 Appearance */
  function appearance() {
    var A = [['tide', 'Tide', 1], ['ember', 'Ember'], ['aurora', 'Aurora'], ['moss', 'Moss'], ['graphite', 'Graphite']];
    return side('') + '<main class="col"' + ab('left:180px;right:10px;top:14px;bottom:10px;padding:0 var(--s-1);gap:var(--s-3)') + path('Appearance') +
      '<div class="t-title">Appearance</div>' +
      '<div class="t-heading" style="margin-top:var(--s-2)">Household accent</div>' +
      '<div class="t-label t-2">Used on every device unless something more specific is set.</div>' +
      '<div class="grp surface"><div class="swatches">' + A.map(function (a) { return '<div class="swi"><i class="sw accent-' + a[0] + (a[2] ? ' sel' : '') + '"></i><span class="t-label">' + a[1] + '</span></div>'; }).join('') + '</div></div>' +
      '<div class="t-label t-2">Light and dark follow each device and are not chosen here.</div></main>';
  }

  /* 5 Search */
  function search() {
    var R = [['<mark>Wake</mark> words', 'Assistants &rsaquo; Juno &rsaquo; Identity'], ['<mark>Wake</mark> word listening', 'Devices &rsaquo; Kitchen tablet'], ['<mark>Wake</mark> word attempts', 'Logs &rsaquo; Summoning']];
    var rows = R.map(function (r, i) {
      return '<div class="row big' + (i === 0 ? ' is-selected' : '') + '">' + IC + '<div class="grow"><div class="t-strong ell">' + r[0] + '</div><div class="sub ell">' + r[1] + '</div></div><span class="chev">&rsaquo;</span></div>';
    });
    return side('', 'wake') + listCol('Results', rows, '') + quiet('Choose a result', '3 settings found');
  }

  /* 6 Request list, 7 one request */
  var R = [
    ['09:41', 'Alex', 'Set a pasta timer for&hellip;', '1.42 s', [40, 85, 310, 720, 45, 220]],
    ['09:38', 'Sam', 'What is on the shopping&hellip;', '0.96 s', [40, 70, 200, 480, 30, 140]],
    ['09:21', 'Guest', 'What time is it', '0.71 s', [40, 60, 150, 300, 20, 140]],
    ['08:55', 'Alex', 'Send this to Sam&rsquo;s&hellip;', '2.80 s', [40, 90, 300, 1900, 70, 400], 1],
    ['08:12', 'Jo', 'Stop the alarm', '0.52 s', [40, 50, 120, 200, 20, 90]]
  ];
  function strip(r) {
    var hi = r[4].indexOf(Math.max.apply(null, r[4])), sum = r[4].reduce(function (a, b) { return a + b; }, 0);
    return '<div class="strip"' + at('width:' + (sum / 2800 * 100).toFixed(1) + '%') + '>' + r[4].map(function (v, i) { return '<i class="' + (i === hi ? 'ac' : (i % 2 ? 'n2' : 'n1')) + '"' + at('flex:' + v) + '></i>'; }).join('') + '</div>';
  }
  function reqList(sel) {
    var rows = R.map(function (r, i) {
      return '<div class="row lrow' + (sel && i === 0 ? ' is-selected' : '') + '"><div class="grow"><div class="lrow top"><span class="t-mono t-2" style="font-size:11px">' + r[0] + '</span><span class="t-strong ell">' + r[1] + '</span><span class="grow"></span><span class="tot t-mono">' + r[3] + '</span></div><div class="sub ell" style="font-size:11px">' + r[2] + '</div>' + strip(r) + '</div></div>';
    });
    return '<section class="col"' + ab('left:180px;top:10px;bottom:10px;width:230px;gap:2px') +
      '<div class="t-heading" style="padding:var(--s-1) var(--s-2) 0">Requests</div><div class="t-caption" style="padding:0 var(--s-2) var(--s-1)">Today &middot; newest first</div>' + rows.join('') + '</section>';
  }
  function requests() {
    return side('Requests') + reqList(0) +
      '<main class="col empty"' + ab('left:420px;right:10px;top:10px;bottom:10px') + '<div class="t-heading">Choose a request</div><div class="t-label t-2">38 requests today</div></main>';
  }
  function bars() {
    var S = ['Wake word', 'Speaker identified (Alex)', 'Speech to text', 'AI model', 'Tools called (timers.set)', 'Text to speech'];
    var T = [[0, 40], [40, 85], [125, 310], [435, 720], [1060, 45], [1200, 220]], TOT = 1420;
    var rows = T.map(function (t, i) {
      return '<div class="wf"><div class="l"><span class="t-label grow ell">' + S[i] + '</span><span class="t-mono t-label">' + t[1] + ' ms</span></div><div class="track"><i class="' + (i === 3 ? 'ac' : 'n2') + '"' + at('left:' + (t[0] / TOT * 100).toFixed(2) + '%;width:' + (t[1] / TOT * 100).toFixed(2) + '%') + '></i></div></div>';
    }).join('');
    return side('Requests') + reqList(1) +
      '<main class="col"' + ab('left:420px;right:10px;top:14px;bottom:10px;padding:0 var(--s-1);gap:var(--s-3)') + path('Logs &rsaquo; Requests &rsaquo; 09:41') +
      '<div><div class="t-strong">Alex &middot; Kitchen tablet</div><div class="t-label t-2">&ldquo;Set a pasta timer for eight minutes&rdquo;</div><div class="t-label t-2" style="margin-top:2px">Total <span class="t-mono" style="color:var(--text);font-weight:600">1.42 s</span></div></div>' +
      '<div class="col" style="gap:var(--s-3)">' + rows + '</div></main>';
  }

  /* 8 Audit */
  function audit() {
    var A = [['A', 'Juno: Email ability', 'Alex &middot; 09:20 &middot; off &rarr; on'], ['A', 'Household accent', 'Alex &middot; 09:12 &middot; Aurora &rarr; Tide'], ['S', 'Sam&rsquo;s accent', 'Sam &middot; Yesterday 20:41 &middot; Tide &rarr; Ember'], ['A', 'Kitchen tablet: wake word listening', 'Alex &middot; Yesterday 18:03 &middot; off &rarr; on'], ['A', 'Bedroom tablet approved', 'Alex &middot; Yesterday 18:01 &middot; waiting &rarr; approved'], ['A', 'Juno: AI provider', 'Alex &middot; Mon 07:30 &middot; Local small &rarr; Local medium'], ['A', 'Jo: role', 'Alex &middot; Sun 21:10 &middot; Admin &rarr; Member']];
    var rows = A.map(function (a) { return bigRow(av(a[0]), a[1], a[2], 0, '<span class="btn btn-quiet">Undo</span>'); });
    return side('Audit') + '<section class="col"' + ab('left:180px;right:10px;top:10px;bottom:10px;gap:2px') +
      '<div class="t-heading" style="padding:var(--s-1) var(--s-2) 0">Audit</div><div class="t-caption" style="padding:0 var(--s-2) var(--s-1)">Every settings change &middot; newest first</div>' + rows.join('') + '</section>';
  }

  /* 9 Setup */
  function dots(n) { return '<div class="dots">' + [1, 2, 3, 4, 5].map(function (i) { return '<i class="' + (i < n ? 'done' : (i === n ? 'now' : '')) + '"></i>'; }).join('') + '</div>'; }
  function hello() {
    return '<div' + ab('left:0;right:0;top:26px') + dots(0) + '</div>' +
      '<div class="col mid"' + ab('left:219px;width:300px;top:80px;gap:var(--s-3)') +
      '<div class="t-display-xl" style="font-size:64px;line-height:1">Hello</div><div class="t-heading t-2" style="font-weight:400">Let&rsquo;s set up Hearth for your household.</div>' +
      '<div style="margin-top:var(--s-3)">' + fig(120) + '</div></div>' +
      '<span class="btn btn-primary bigbtn"' + ab('left:219px;width:300px;bottom:22px') + 'Get started</span>';
  }
  function step() {
    return '<div' + ab('left:0;right:0;top:26px') + dots(1) + '</div><span class="back"' + ab('left:28px;top:16px') + '&lsaquo;</span>' +
      '<div class="col mid"' + ab('left:219px;width:300px;top:66px;gap:var(--s-2)') +
      '<span class="sym"><span class="ico"></span></span><div class="t-title" style="font-size:26px;line-height:1.15;font-weight:700">Mail account</div>' +
      '<div class="t-label t-2" style="margin-bottom:var(--s-2)">Hearth sends sign-in codes from this account.</div>' +
      '<div class="fgrid"><div class="fl"><span class="field-label">Mail server</span><div class="field">mail.example.org</div></div><div class="fl"><span class="field-label">Port</span><div class="field">587</div></div>' +
      '<div class="fl full"><span class="field-label">User name</span><div class="field">home@example.org</div></div><div class="fl full"><span class="field-label">Password</span><div class="field">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</div></div></div>' +
      '<span class="link" style="margin-top:var(--s-2)">Why is this needed?</span></div>' +
      '<span class="btn btn-primary bigbtn"' + ab('left:219px;width:300px;bottom:22px') + 'Continue</span>';
  }

  /* 10 Narrow */
  function narrow() {

  var S = [

    ['9. First-run setup: Hello', 'The welcome of a new server.', hello, 0,
