<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heem desktop client mockups</title>
<link rel="stylesheet" href="../examples/tokens.css">
<link rel="stylesheet" href="../examples/components.css">
<link rel="stylesheet" href="mockup.css">
<style>
  /* Layout only. */
  .grid { display: grid; grid-template-columns: 580px 580px; gap: 36px 40px; }
  .grid .screen { width: 580px; }
  .frame.f { width: 580px; height: 400px; border-radius: 12px; }
  .pi { display: block; flex: none; }
  .w-list { width: 440px; }
  .w-wide { width: 540px; height: 330px; }
  .w-set { width: 560px; height: 376px; }
  .window .search { height: 44px; padding: 0 var(--s-4); font: var(--type-heading); font-weight: 500; white-space: nowrap; }
  .window .search .caret { height: 18px; }
  .chs { display: flex; gap: 4px; padding: var(--s-2) var(--s-2) var(--s-1); }
  .chs .chip { flex: 1; min-width: 0; padding: 0 6px; gap: 4px; justify-content: center; color: var(--text); overflow: hidden; }
  .chs .chip.all { flex: none; padding: 0 10px; }
  .chs .chip.on { background: var(--accent-soft); font-weight: 600; }
  .list-pane { flex: 1; min-width: 0; padding: var(--s-1) var(--s-2) var(--s-2); display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .row .t-caption { white-space: nowrap; }
  .row .grow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { display: inline; margin-left: var(--s-2); }
  .row .num { white-space: nowrap; }
  .body { flex: 1; min-height: 0; display: flex; }
  .list-pane.narrow { flex: none; width: 250px; border-right: 1px solid var(--line); }
  .preview { flex: 1; min-width: 0; padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); overflow: hidden; }
  .cap { padding: var(--s-1) var(--s-2) 0; }
  .foot { flex: none; min-height: 32px; padding: 0 var(--pad); display: flex; align-items: center; gap: var(--s-3); border-top: 1px solid var(--line); }
  .foot .sp { flex: 1; }
  .hint { display: inline-flex; align-items: center; gap: 6px; font: var(--type-label); color: var(--text-2); white-space: nowrap; }
  .avatar.sm { width: 22px; height: 22px; font: var(--type-caption); }
  .snippet { padding: var(--s-3); border-radius: var(--r-md); background: var(--surface-2); }
  .thumb { height: 70px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; }
  .assist-fig { flex: none; width: 190px; display: flex; align-items: flex-end; justify-content: center; padding: var(--s-3); }
  .chat { flex: 1; min-width: 0; padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); justify-content: flex-end; overflow: hidden; }
  .chat .field { height: 30px; }
  .ghost { position: absolute; top: 50%; transform: translateY(-50%); border: 1px dashed var(--text-3); border-radius: var(--r-xl); pointer-events: none; }
  .ghost span { position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%); font: var(--type-caption); color: var(--text); white-space: nowrap; background: var(--glass-solid); padding: 1px 8px; border-radius: var(--r-full); }
  .dim { position: absolute; inset: 0; background: color-mix(in srgb, black 35%, transparent); }
  .sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 300px; padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-3); }
  .acts { display: flex; gap: var(--s-2); }
  .acts .btn { flex: 1; }
  .btn.sm { height: 26px; padding: 0 var(--s-2); font-size: 12px; }
  .quietbar { flex: none; padding: var(--s-2) var(--pad); display: flex; align-items: center; gap: var(--s-2); background: var(--surface-2); border-bottom: 1px solid var(--line); font: var(--type-label); }
  .quietbar .grow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; flex: none; }

  /* notifications */
  .notif { position: absolute; right: 12px; width: 260px; padding: var(--s-3); display: flex; flex-direction: column; gap: 2px; }
  .notif .hd { display: flex; align-items: center; gap: var(--s-2); }
  .notif .hd .grow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .notif .btns { display: flex; gap: var(--s-2); margin-top: var(--s-2); }
  .notif .btns .btn { flex: 1; height: 28px; }

  /* tray */
  .topbar { position: absolute; left: 0; right: 0; top: 0; height: 26px; display: flex; align-items: center; justify-content: flex-end; gap: var(--s-3); padding: 0 var(--s-4); border-radius: 0; border-width: 0 0 1px 0; font: var(--type-caption); }
  .topbar .blk { width: 12px; height: 6px; border-radius: 2px; background: var(--text-3); }
  .topbar .tray { width: 24px; height: 20px; border-radius: 6px; display: grid; place-items: center; }
  .topbar .tray.on { background: var(--accent-soft); }
  .menu { position: absolute; right: 10px; top: 32px; width: 210px; padding: 5px; border-radius: var(--r-md); display: flex; flex-direction: column; gap: 1px; }
  .menu .m { display: flex; align-items: center; gap: var(--s-2); height: 30px; padding: 0 var(--s-2); border-radius: var(--r-xs); font: var(--type-label); }
  .menu .m.sel { background: var(--accent-soft); }
  .menu hr { margin: 3px 0; }

  /* settings */
  .s3-side { flex: none; width: 118px; padding: var(--s-2); display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); }
  .s3-top { display: flex; flex-direction: column; gap: var(--s-2); padding: 0 var(--s-1) var(--s-2); }
  .s3-back { display: inline-flex; align-items: center; gap: var(--s-2); align-self: flex-start; height: 24px; padding: 0 var(--s-2); border-radius: var(--r-full); background: var(--control); font: var(--type-label); white-space: nowrap; }
  .s3-search { display: flex; align-items: center; gap: var(--s-1); height: 30px; padding: 0 var(--s-2); border-radius: var(--r-md); background: var(--control); font: var(--type-label); white-space: nowrap; overflow: hidden; }
  .s3-search .caret { width: 2px; height: 14px; background: var(--accent); }
  .s3-side .row { padding: 0 var(--s-2); gap: var(--s-2); }
  .s3-mid { flex: none; width: 176px; padding: var(--s-2); display: flex; flex-direction: column; gap: 2px; border-radius: 0; border: 0; border-right: 1px solid var(--line); }
  .s3-mid .row .val { font: var(--type-label); color: var(--text-2); white-space: nowrap; }
  .s3-mid .row { padding: 0 var(--s-2); gap: var(--s-1); }
  .s3-page { flex: 1; min-width: 0; padding: var(--s-4) var(--s-4) 0; display: flex; flex-direction: column; gap: var(--s-3); overflow: hidden; border-radius: 0; border: 0; }
  .s3-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); }
  .s3-sws { display: flex; align-items: center; gap: var(--s-2); }
  .s3-sw { width: 22px; height: 22px; border-radius: 50%; flex: none; display: block; background: linear-gradient(135deg, var(--accent) 50%, var(--accent-2) 50%); }
  .s3-sw.sel { outline: 2px solid var(--text); outline-offset: 2px; }
  .s3-link { font: var(--type-label); font-weight: 600; color: var(--accent); }
  .savebar { margin: auto calc(var(--s-4) * -1) 0; padding: var(--s-2) var(--s-2); display: flex; align-items: center; gap: var(--s-2); border-top: 1px solid var(--line); background: var(--surface-2); }
  .savebar .grow { flex: 1; min-width: 0; font: var(--type-label); font-weight: 600; display: flex; align-items: center; gap: var(--s-2); white-space: nowrap; }
  .col-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .lab { font: var(--type-label); color: var(--text-2); display: flex; align-items: center; gap: var(--s-2); }

  /* account switch */
  .people { display: flex; justify-content: center; gap: var(--s-6); padding: var(--s-3) var(--s-4); }
  .person { display: flex; flex-direction: column; align-items: center; gap: var(--s-2); padding: var(--s-3); border-radius: var(--r-lg); }
  .person.on { background: var(--accent-soft); }
  .person .avatar { width: 44px; height: 44px; font: var(--type-heading); }
  .pass { margin: 0 var(--s-4) var(--s-3); }

  /* where it opens, what it remembers */
  .mon { position: absolute; top: 16px; width: 262px; height: 140px; border: 3px solid var(--text); border-radius: 8px; overflow: hidden; }
  .mon .win { position: absolute; left: 14px; top: 14px; width: 150px; height: 90px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
  .mon .mini { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 150px; padding: 5px; display: flex; flex-direction: column; gap: 3px; border-radius: var(--r-lg); }
  .mon .mini .f { height: 10px; border-radius: 5px; background: var(--control-hover); }
  .mon .mini .r { height: 6px; border-radius: 3px; background: var(--control-hover); }
  .mon .mini .r.s { background: var(--accent-soft); }
  .mon .ptr { position: absolute; left: 150px; top: 92px; color: var(--text); }
  .mon-cap { position: absolute; top: 162px; width: 262px; text-align: center; font: var(--type-label); }
  .mon-cap b { font-weight: 600; }
  .tl { position: absolute; left: 24px; right: 24px; top: 204px; }
  .tl .bar { position: relative; height: 8px; border-radius: 4px; background: var(--control-hover); }
  .tl .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 38%; border-radius: 4px; background: var(--accent); }
  .tl .lbls { display: flex; justify-content: space-between; padding-top: var(--s-2); font: var(--type-label); }
  .tl .two { display: flex; gap: var(--s-3); margin-top: var(--s-3); }
  .tl .two > div { flex: 1; padding: var(--s-2) var(--s-3); border-radius: var(--r-md); font: var(--type-label); }
  .note { max-width: 580px; }
  .chs .chip.is-focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dense .row { height: 28px; min-height: 28px; }
  .dense .search { height: 38px; }
  .row.dimmed { opacity: .55; }
  .row .snz { font: var(--type-caption); white-space: nowrap; }
  .menu.acts-menu { top: auto; bottom: 40px; right: 14px; width: 250px; }
  .menu .m .grow { flex: 1; }
</style>
</head>
<body class="va">
<div class="mock-page">

<header>
  <h1>Heem desktop client</h1>
  <p>A clear glass launcher over the desktop. It lists what is running, then every action, and it is wide with a preview only for the clipboard. The settings are a view of it. Frames are shown at reduced size, two to a row.</p>
</header>

<div class="grid">

<!-- 1 -->
<figure class="screen">
  <figcaption>
    <h2>1. The launcher before anything is typed</h2>
    <p>What is running now, then every action, most used first.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact light">
    <div class="window glass w-list">
      <div class="search"><i data-i="search" data-s="18"></i><span class="t-3">Search commands, views and clipboard</span></div>
      <div class="chs">
        <span class="chip"><i data-i="clip" data-s="12"></i><span>Clipboard</span></span>
        <span class="chip is-focus"><i data-i="timer" data-s="12"></i><span>Timers</span></span>
        <span class="chip"><i data-i="lists" data-s="12"></i><span>Lists</span></span>
        <span class="chip"><i data-i="bell" data-s="12"></i><span>Notifications</span></span>
        <span class="chip all"><i data-i="all" data-s="12"></i><span>All</span></span>
      </div>
      <div class="list-pane">
        <div class="t-caption cap">Running now</div>
        <div class="row is-selected"><i data-i="timer"></i><span class="grow">Pasta timer</span><span class="num t-strong">07:12</span></div>
        <div class="t-caption cap">All actions, most used first</div>
        <div class="row"><i data-i="clip"></i><span class="grow">Clipboard history</span><span class="kbd">Ctrl ⇧ V</span></div>
        <div class="row"><span class="character accent-ember" style="--size:18px"></span><span class="grow">Talk to Juno</span></div>
        <div class="row"><i data-i="timer"></i><span class="grow">Set a timer</span></div>
        <div class="row"><i data-i="gear"></i><span class="grow">Settings</span></div>
      </div>
      <div class="foot"><span class="avatar sm">A</span><span class="t-label">Alex</span><span class="sp"></span><span class="hint"><span class="kbd">↵</span>Open</span><span class="hint"><span class="kbd">Ctrl K</span>Actions</span></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Window: clear glass, about half see-through, over the desktop. A list only, with no preview. It is compact.</div>
    <div class="note">Under the search field: the person's four areas, set on this device, and "All". Then what is running now, such as a timer, on top, and every action under it, ordered by this person's own use.</div>
    <div class="note">Talking to the assistant is an action in the list. It has no shortcut at first; a person can give it one, and Enter on its row starts it. The assistant's head is small, in its own two colours; the buttons and highlight follow the person's accent.</div>
    <div class="note">Tab and Shift+Tab move between the chips, and the focused chip has a ring. A chip opens its area. An area can have its own shortcut, which opens the launcher straight into it.</div>
  </div>
</figure>

<!-- 2 -->
<figure class="screen">
  <figcaption>
    <h2>2. Results while typing</h2>
    <p>A list only. A plain search for actions needs no preview.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact dark">
    <div class="window glass w-list">
      <div class="search"><i data-i="search" data-s="18"></i><span>tim</span><span class="caret"></span></div>
      <div class="chs">
        <span class="chip"><i data-i="clip" data-s="12"></i><span>Clipboard</span></span>
        <span class="chip"><i data-i="timer" data-s="12"></i><span>Timers</span></span>
        <span class="chip"><i data-i="lists" data-s="12"></i><span>Lists</span></span>
        <span class="chip"><i data-i="bell" data-s="12"></i><span>Notifications</span></span>
        <span class="chip all"><i data-i="all" data-s="12"></i><span>All</span></span>
      </div>
      <div class="list-pane">
        <div class="t-caption cap">Actions</div>
        <div class="row is-selected"><i data-i="timer"></i><span class="grow">Set a timer</span><span class="kbd">↵</span></div>
        <div class="row"><span class="character accent-ember" style="--size:18px"></span><span class="grow">Talk to Juno with “tim”</span></div>
        <div class="t-caption cap">Views</div>
        <div class="row"><i data-i="timer"></i><span class="grow">Timers</span><span class="chip">1 running</span></div>
        <div class="row"><i data-i="timeline"></i><span class="grow">Timeline</span></div>
      </div>
      <div class="foot"><span class="avatar sm">A</span><span class="t-label">Alex</span><span class="sp"></span><span class="hint"><span class="kbd">↵</span>Run</span><span class="hint"><span class="kbd">Esc</span>Clear</span></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Results narrow with each key, in small groups. The first row is selected. Enter on “Talk to Juno” hands what was typed to the assistant.</div>
    <div class="note">The window keeps the size of the list. It widens only for a view with a preview.</div>
  </div>
</figure>

<!-- 3 -->
<figure class="screen">
  <figcaption>
    <h2>3. The clipboard</h2>
    <p>The one view with a preview. The window grows to the wide size.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact light">
    <div class="ghost" style="left:70px;width:440px;height:340px"><span>The size of the list</span></div>
    <div class="window glass w-wide">
      <div class="search"><i data-i="search" data-s="18"></i><span class="t-3">Search what you copied</span></div>
      <div class="chs">
        <span class="chip on"><i data-i="clip" data-s="12"></i><span>Clipboard</span></span>
        <span class="chip"><i data-i="timer" data-s="12"></i><span>Timers</span></span>
        <span class="chip"><i data-i="lists" data-s="12"></i><span>Lists</span></span>
        <span class="chip"><i data-i="bell" data-s="12"></i><span>Notifications</span></span>
        <span class="chip all"><i data-i="all" data-s="12"></i><span>All</span></span>
      </div>
      <div class="body">
        <div class="list-pane narrow">
          <div class="row is-selected"><i data-i="clip"></i><span class="grow">Pasta, 8 minutes</span><span class="t-caption">now</span></div>
          <div class="row"><i data-i="link"></i><span class="grow">example.org/menu</span><span class="t-caption">4 m</span></div>
          <div class="row"><i data-i="image"></i><span class="grow">Image, 1200×800</span><span class="t-caption">1 h</span></div>
          <div class="row"><i data-i="lock"></i><span class="grow">Door code 4821</span><span class="t-caption">2 h</span></div>
        </div>
        <div class="preview">
          <div class="t-caption">Text, from Sam’s phone</div>
          <div class="snippet"><span class="t-body">Pasta, 8 minutes. Salt the water first.</span></div>
          <div class="thumb t-caption">An image shows here for images</div>
          <div class="hstack" style="gap:var(--s-2)"><span class="chip">Shared</span></div>
        </div>
      </div>
      <div class="foot"><span class="sp"></span><span class="hint"><span class="kbd">↵</span>Paste</span><span class="hint"><span class="kbd">Ctrl K</span>Actions</span></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Left: what was copied, newest first, as plain rows. Right: a preview of the selected row, text or image.</div>
    <div class="note">The window widens with a short animation from the list's size, which the dashed outline shows, and stays centred. Only the clipboard has a preview for now; other views can use the kind that fits them later.</div>
  </div>
</figure>

<!-- 4 -->
<figure class="screen">
  <figcaption>
    <h2>4. Talking to the assistant</h2>
    <p>Chosen from the list with Enter, or with a shortcut a person has given it.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact dark">
    <div class="window glass w-wide">
      <div class="search"><i data-i="assistant" data-s="18"></i><span>Talk to Juno</span><span class="caret"></span></div>
      <hr class="divider">
      <div class="body">
        <div class="assist-fig"><div class="figure accent-ember" style="--size:96px"><div class="character listening" style="--size:96px"></div></div></div>
        <div class="chat">
          <div class="bubble me">Set a timer for 8 minutes, for the pasta.</div>
          <div class="bubble">Done. Eight minutes for the pasta, starting now.</div>
          <div class="hstack" style="gap:var(--s-2)"><span class="loader"></span><span class="t-label t-2">Listening</span></div>
          <div class="field"><span class="ph">Type to Juno</span></div>
        </div>
      </div>
      <div class="foot"><span class="t-label">Juno</span><span class="sp"></span><span class="hint"><span class="kbd">Esc</span>Back to search</span></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Left: the figure, in its own two colours, which listens, speaks and reacts. Right: the conversation, newest at the bottom, and a field to type in. The buttons and bubbles of the person follow their accent.</div>
    <div class="note">Not decided: the exact arrangement of the figure and the conversation in the launcher, and how large the figure is here. The figure shown is the simple one for now.</div>
  </div>
</figure>

<!-- 5 -->
<figure class="screen">
  <figcaption>
    <h2>5. A card row lifted into a sheet</h2>
    <p>A timer is a compact row. A click lifts it into a thick glass sheet over the dimmed launcher.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact light">
    <div class="window glass w-list">
      <div class="search"><i data-i="search" data-s="18"></i><span class="t-3">Timers</span></div>
      <hr class="divider">
      <div class="list-pane">
        <div class="row is-selected"><i data-i="timer"></i><span class="grow">Pasta</span><span class="num">07:12</span></div>
        <div class="row"><i data-i="timer"></i><span class="grow">Laundry</span><span class="num">34:00</span></div>
        <div class="row"><i data-i="timer"></i><span class="grow">Oven</span><span class="num">Done</span></div>
      </div>
    </div>
    <div class="dim"></div>
    <div class="sheet glass-thick">
      <div class="hstack" style="gap:var(--s-2)"><i data-i="timer" data-s="18"></i><span class="t-heading grow">Pasta</span><span class="chip">Running</span></div>
      <div class="t-display num">07:12</div>
      <div class="acts"><button class="btn">Pause</button><button class="btn">Add a minute</button><button class="btn btn-quiet">Cancel</button></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">The sheet grows out of the row that was clicked and shrinks back into it. The rest of the launcher is dimmed. It closes with its button, a click outside it or Esc.</div>
    <div class="note">The actions shown are examples for a timer; each kind of card offers its own.</div>
  </div>
</figure>

<!-- 6 -->
<figure class="screen">
  <figcaption>
    <h2>6. Notifications at the top right</h2>
    <p>Clear glass cards stack down from the top right of the desktop, newest on top, outside the launcher.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact dark">
    <div class="notif glass" style="top:12px">
      <div class="hd"><i data-i="timer" data-s="16"></i><span class="t-strong grow">Pasta timer</span><span class="t-caption" style="white-space:nowrap">now</span></div>
      <span class="t-label t-2">Eight minutes are up.</span>
    </div>
    <div class="notif glass" style="top:84px">
      <div class="hd"><i data-i="mail" data-s="16"></i><span class="t-strong grow">New email</span><span class="t-caption">2 m</span></div>
      <span class="t-label t-2">From Jo: Saturday plans</span>
    </div>
    <div class="notif glass" style="top:156px">
      <div class="hd"><i data-i="lists" data-s="16"></i><span class="t-strong grow">Shopping list</span><span class="t-caption">9 m</span></div>
      <span class="t-label t-2">Sam added milk.</span>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Each card is a compact row of icon, title, time and one line, in clear glass. Several stack downward with the newest on top. The card is the same card as on a phone; only its place follows the width.</div>
    <div class="note">Every notification also stays in the Notifications view.</div>
  </div>

    groups.map(function (g, i) { return '<div class="row' + (i === sel ? ' is-selected' : '') + '">' + I(g[0]) + '<span class="grow">' + g[1] + '</span></div>'; }).join('') + '</div>';

  var mid, page;
  if (kind === 'search') {
    mid = '<div class="s3-mid surface"><div class="t-caption cap">2 results</div>' +

    page = '<div class="s3-page surface"><div><div class="t-caption">Settings › Voice › Microphone</div><div class="t-heading">Microphone</div></div>' +

  } else {
    var d1 = kind === 'main' ? '<span class="pdot"></span>' : offline ? I('clock', 12) : '';
    mid = '<div class="s3-mid surface"><div class="t-caption cap">Look</div>' +
      '<div class="row is-selected"><span class="grow">Accent</span>' + d1 + '<span class="val">Ember</span></div>' +

      '<div class="row"><span class="grow">Reduce motion</span>' + (kind === 'main' ? '<span class="pdot"></span>' : '') + '<span class="val">' + (kind === 'main' ? 'On' : 'Off') + '</span></div></div>';
    var sws = SW.map(function (a) { return '<span class="s3-sw accent-' + a[0] + (a[0] === 'ember' ? ' sel' : '') + '" title="' + a[1] + '"></span>'; }).join('');
    page = '<div class="s3-page surface"><div><div class="t-caption">Settings › Look › Accent</div><div class="t-heading hstack" style="gap:var(--s-2)">Accent' + (kind === 'main' ? '<span class="pdot"></span>' : '') + '</div></div>' +
      '<div class="t-label t-2">The colour of buttons and highlights in the launcher on this device.</div>' +
      '<div class="s3-box"><div class="s3-sws">' + sws + '</div>' +
      '<div class="hstack" style="gap:var(--s-2);flex-wrap:wrap"><span class="chip"><span class="dot"></span>Follow the household</span><span class="s3-link" style="white-space:nowrap">Make your own</span></div>' +
      (offline ? '<span class="chip warning" style="align-self:flex-start">' + I('clock', 12) + 'Waiting to send</span>' : '') + '</div>' +
      (kind === 'main' ? '<div class="savebar"><span class="grow"><span class="pdot"></span>2 changes not saved</span><button class="btn btn-quiet sm">Discard</button><button class="btn btn-primary sm">Save</button></div>' : '') + '</div>';
  }
  var bar = offline ? '<div class="quietbar"><span class="dot"></span><span class="grow">Home cannot be reached. 1 change waiting to send.</span><button class="btn btn-quiet sm">Try again</button></div>' : '';
  var foot = kind === 'search' ? '<div class="foot"><span class="hint"><span class="kbd">Esc</span>Clears the search</span><span class="hint"><span class="kbd">Esc</span>Then back to the list</span><span class="sp"></span><span class="hint"><span class="kbd">↵</span>Open</span></div>' : '';
  return '<div class="col-wrap">' + bar + '<div class="body">' + side + mid + page + '</div>' + foot + '</div>';
}
