<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop client mockups</title>
<link rel="stylesheet" href="../examples/tokens.css">
<link rel="stylesheet" href="../examples/components.css">
<link rel="stylesheet" href="mockup.css">
<style>
  /* Layout only. */
  .grid { display: grid; grid-template-columns: 580px 580px; gap: 36px 40px; }
  .grid .screen { width: 580px; }
  .frame.f { width: 580px; height: 380px; border-radius: 12px; }
  .w-list { width: 440px; height: 290px; }
  .w-wide { width: 540px; height: 290px; }
  .w-sheetbase { width: 440px; height: 290px; }
  .w-set { width: 540px; height: 310px; }
  .body { flex: 1; min-height: 0; display: flex; }
  .list-pane { flex: 1; min-width: 0; padding: var(--s-2); display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .row .t-caption { white-space: nowrap; }
  .list-pane.narrow { flex: none; width: 260px; border-right: 1px solid var(--line); }
  .preview { flex: 1; min-width: 0; padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); overflow: hidden; }
  .cap { padding: var(--s-1) var(--pad); }
  .foot { flex: none; min-height: 32px; padding: 0 var(--pad); display: flex; align-items: center; gap: var(--s-3); border-top: 1px solid var(--line); }
  .foot .sp { flex: 1; }
  .hint { display: inline-flex; align-items: center; gap: 6px; font: var(--type-label); color: var(--text-2); }
  .avatar.sm { width: 22px; height: 22px; font: var(--type-caption); }
  .snippet { padding: var(--s-3); border-radius: var(--r-md); background: var(--surface-2); }
  .thumb { height: 90px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; }
  .side { flex: none; width: 190px; padding: var(--s-2); display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); }
  .page { flex: 1; min-width: 0; padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); overflow: hidden; }
  .setrow { display: flex; align-items: center; gap: var(--s-3); min-height: 34px; border-bottom: 1px solid var(--line); }
  .assist-fig { flex: none; width: 190px; display: flex; align-items: flex-end; justify-content: center; padding: var(--s-3); }
  .chat { flex: 1; min-width: 0; padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); justify-content: flex-end; overflow: hidden; }
  .dim { position: absolute; inset: 0; background: color-mix(in srgb, black 35%, transparent); }
  .sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 300px; padding: var(--s-4); display: flex; flex-direction: column; gap: var(--s-3); }
  .acts { display: flex; gap: var(--s-2); }
  .notif { position: absolute; right: 12px; width: 250px; padding: var(--s-3); display: flex; flex-direction: column; gap: 2px; }
  .waitline { height: 2px; background: var(--accent); flex: none; }
  .quietbar { flex: none; padding: var(--s-2) var(--pad); display: flex; align-items: center; gap: var(--s-2); background: var(--surface-2); border-bottom: 1px solid var(--line); font: var(--type-label); }
  .people { display: flex; justify-content: center; gap: var(--s-6); padding: var(--s-4); }
  .person { display: flex; flex-direction: column; align-items: center; gap: var(--s-2); padding: var(--s-3); border-radius: var(--r-lg); }
  .person.on { background: var(--accent-soft); }
  .person .avatar { width: 48px; height: 48px; font: var(--type-heading); }
  .empty { flex: 1; display: grid; place-items: center; }
  .note { max-width: 580px; }
</style>
</head>
<body class="va">
<div class="mock-page">

<header>
  <h1>Desktop client</h1>
  <p>A clear glass launcher over the desktop. It is a list, or wide with a preview when the content needs one. Settings are a view of it. Frames are shown at reduced size, two to a row.</p>
</header>

<div class="grid">

<!-- 1 -->
<figure class="screen">
  <figcaption>
    <h2>1. The empty launcher</h2>
    <p>A list only. What it suggests before anything is typed is not decided.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact light">
    <div class="window glass w-list">
      <div class="search"><span class="ico"></span><span class="t-3">Search commands, views and clipboard</span></div>
      <hr class="divider">
      <div class="list-pane">
        <div class="t-caption cap">Suggested</div>
        <div class="row is-selected"><span class="ico"></span><span class="grow">Clipboard</span><span class="kbd">Ctrl ⇧ V</span></div>
        <div class="row"><span class="ico"></span><span class="grow">Ask Juno</span><span class="kbd">Tab</span></div>
        <div class="row"><span class="ico"></span><span class="grow">Set a timer</span></div>
        <div class="row"><span class="ico"></span><span class="grow">Notifications</span></div>
      </div>
      <div class="foot"><span class="avatar sm">A</span><span class="t-label">Alex</span><span class="sp"></span><span class="hint"><span class="kbd">↵</span>Open</span></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Window: clear glass, about half see-through, over the desktop. No preview, so a list only.</div>
    <div class="note">Rows: plain, with icon, name and the bound shortcut. Up and Down move, Enter runs.</div>
    <div class="note">Not decided: whether suggestions show before typing, and which ones. The rows here are a placeholder.</div>
  </div>
</figure>

<!-- 2 -->
<figure class="screen">
  <figcaption>
    <h2>2. Results while typing</h2>
    <p>A list only. A plain search for actions needs no preview.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact dark">
    <div class="window glass w-list">
      <div class="search"><span class="ico"></span><span>tim</span><span class="caret"></span></div>
      <hr class="divider">
      <div class="list-pane">
        <div class="t-caption cap">Commands</div>
        <div class="row is-selected"><span class="ico"></span><span class="grow">Set a timer</span><span class="kbd">↵</span></div>
        <div class="t-caption cap">Views</div>
        <div class="row"><span class="ico"></span><span class="grow">Timers</span><span class="chip">1 running</span></div>
        <div class="row"><span class="ico"></span><span class="grow">Timeline</span></div>
      </div>
      <div class="foot"><span class="avatar sm">A</span><span class="t-label">Alex</span><span class="sp"></span><span class="hint"><span class="kbd">↵</span>Run</span><span class="hint"><span class="kbd">Ctrl K</span>Actions</span></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Results narrow with each key, grouped under small captions. The first row is selected.</div>
    <div class="note">The window stays the same size as the empty launcher. Not decided: whether it ever changes size between a list and a wide view.</div>
  </div>
</figure>

<!-- 3 -->
<figure class="screen">
  <figcaption>
    <h2>3. The clipboard</h2>
    <p>Wide, with the list on the left and a preview of the selected row on the right.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact light">
    <div class="window glass w-wide">
      <div class="search"><span class="ico"></span><span class="t-3">Search what you copied</span></div>
      <hr class="divider">
      <div class="body">
        <div class="list-pane narrow">
          <div class="row is-selected"><span class="ico"></span><span class="grow">Pasta, 8 minutes</span><span class="t-caption" style="white-space:nowrap">now</span></div>
          <div class="row"><span class="ico"></span><span class="grow">example.org/menu</span><span class="t-caption">4 m</span></div>
          <div class="row"><span class="ico"></span><span class="grow">Image, 1200×800</span><span class="t-caption">1 h</span></div>
          <div class="row"><span class="ico"></span><span class="grow">Door code 4821</span><span class="t-caption">2 h</span></div>
        </div>
        <div class="preview">
          <div class="t-caption">Text, from Sam's phone</div>
          <div class="snippet"><span class="t-body">Pasta, 8 minutes. Salt the water first.</span></div>
          <div class="thumb t-caption">Image preview for images</div>
          <div class="hstack" style="gap:var(--s-2)"><span class="chip">Shared</span></div>
        </div>
      </div>
      <div class="foot"><span class="sp"></span><span class="hint"><span class="kbd">↵</span>Paste</span><span class="hint"><span class="kbd">Ctrl K</span>Actions</span></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Left: the copied items, newest first, as plain rows. Right: a preview of the selected row, text or image.</div>
    <div class="note">Which other views get a preview is not decided.</div>
  </div>
</figure>

<!-- 4 -->
<figure class="screen">
  <figcaption>
    <h2>4. Talking to the assistant in the launcher</h2>
    <p>Juno's whole figure is the subject, so it gets the left of the window.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact dark">
    <div class="window glass w-wide">
      <div class="search"><span class="ico"></span><span>Ask Juno</span><span class="caret"></span></div>
      <hr class="divider">
      <div class="body">
        <div class="assist-fig"><div class="figure" style="--size:96px"><div class="character listening" style="--size:96px"></div></div></div>
        <div class="chat">
          <div class="bubble me">Set a timer for 8 minutes, for the pasta.</div>
          <div class="bubble">Done. Eight minutes for the pasta, starting now.</div>
          <div class="hstack" style="gap:var(--s-2)"><span class="loader"></span><span class="t-label t-2">Listening</span></div>
        </div>
      </div>
      <div class="foot"><span class="t-label">Juno</span><span class="sp"></span><span class="hint"><span class="kbd">Esc</span>Back to search</span></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Left: the figure, which listens, speaks and reacts. Right: the conversation, newest at the bottom, and a field to type in.</div>
    <div class="note">Not decided: how a person gets here from searching (Tab, a prefix or its own shortcut), and the exact arrangement of figure and conversation.</div>
  </div>
</figure>

<!-- 5 -->
<figure class="screen">
  <figcaption>
    <h2>5. A card row lifted into a sheet</h2>
    <p>A timer is a compact row. A click lifts it into a thick glass sheet over the dimmed launcher.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact light">
    <div class="window glass w-sheetbase">
      <div class="search"><span class="ico"></span><span class="t-3">Timers</span></div>
      <hr class="divider">
      <div class="list-pane">
        <div class="row is-selected"><span class="ico"></span><span class="grow">Pasta</span><span class="num">07:12</span></div>
        <div class="row"><span class="ico"></span><span class="grow">Laundry</span><span class="num">34:00</span></div>
        <div class="row"><span class="ico"></span><span class="grow">Oven</span><span class="num">Done</span></div>
      </div>
    </div>
    <div class="dim"></div>
    <div class="sheet glass-thick">
      <div class="hstack" style="gap:var(--s-2)"><span class="ico"></span><span class="t-heading grow">Pasta</span><span class="chip">Running</span></div>
      <div class="t-display num">07:12</div>
      <div class="acts"><button class="btn grow">Pause</button><button class="btn grow">Add a minute</button><button class="btn btn-quiet">Cancel</button></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">The sheet grows out of the row that was clicked and shrinks back into it. The rest of the launcher is dimmed and softened.</div>
    <div class="note">Not decided: the actions each kind of card offers. The ones here are placeholders.</div>
  </div>
</figure>

<!-- 6 -->
<figure class="screen">
  <figcaption>
    <h2>6. Notifications at the top right</h2>
    <p>Clear glass cards stack down from the top right of the desktop, newest on top, outside the launcher.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact dark">
    <div class="notif glass" style="top:12px">
      <div class="hstack" style="gap:var(--s-2)"><span class="ico"></span><span class="t-strong grow">Pasta timer</span><span class="t-caption" style="white-space:nowrap">now</span></div>
      <span class="t-label t-2">Eight minutes are up.</span>
    </div>
    <div class="notif glass" style="top:88px">
      <div class="hstack" style="gap:var(--s-2)"><span class="ico"></span><span class="t-strong grow">New email</span><span class="t-caption">2 m</span></div>
      <span class="t-label t-2">From Jo: Saturday plans</span>
    </div>
    <div class="notif glass" style="top:164px">
      <div class="hstack" style="gap:var(--s-2)"><span class="ico"></span><span class="t-strong grow">Shopping list</span><span class="t-caption">9 m</span></div>
      <span class="t-label t-2">Sam added milk.</span>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Each card is a compact row of icon, title, time and one line. It fades after a few seconds and stays in the Notifications view.</div>
    <div class="note">Not decided: answering from the keyboard, and whether a question from an assistant stays on screen until answered.</div>
  </div>
</figure>

<!-- 7 -->
<figure class="screen">
  <figcaption>
    <h2>7. The settings view of the launcher</h2>
    <p>Opened from the launcher, laid out like the admin panel: a side bar of groups with search, and the page.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact light">
    <div class="window glass w-set">
      <div class="body">
        <div class="side">
          <div class="search"><span class="ico"></span><span class="t-3">Search settings</span></div>
          <div class="row is-selected"><span class="ico"></span><span class="grow">General</span></div>
          <div class="row"><span class="ico"></span><span class="grow">Shortcuts</span></div>
          <div class="row"><span class="ico"></span><span class="grow">Account</span></div>
          <div class="row"><span class="ico"></span><span class="grow">Appearance</span></div>
          <div class="row"><span class="ico"></span><span class="grow">Notifications</span></div>
        </div>
        <div class="page surface">
          <div class="t-caption">Settings › General</div>
          <div class="t-heading">General</div>
          <div class="setrow"><span class="grow">Start at login</span><span class="toggle on"></span></div>
          <div class="setrow"><span class="grow">Open the launcher with</span><span class="kbd">Ctrl Space</span></div>
          <div class="setrow"><span class="grow">Show on</span><span class="t-2">Screen with the pointer</span></div>
        </div>
      </div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Left: a glass side bar with a search field and the groups. Right: the chosen group's page as plain rows, with its path above.</div>
    <div class="note">Not decided: the groups and what is on each page, whether the window grows, and whether a change applies at once or after Save. The rows here are placeholders.</div>
  </div>
</figure>

<!-- 8 -->
<figure class="screen">
  <figcaption>
    <h2>8. The account switch</h2>
    <p>Plainly drawn: a person is chosen from the avatars.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact dark">
    <div class="window glass w-list" style="height:240px">
      <div class="t-heading cap" style="padding:var(--s-3) var(--pad) 0">Switch account</div>
      <div class="people">
        <div class="person on"><span class="avatar">A</span><span class="t-strong">Alex</span><span class="chip">Signed in</span></div>
        <div class="person"><span class="avatar">S</span><span class="t-strong">Sam</span></div>
        <div class="person"><span class="avatar">J</span><span class="t-strong">Jo</span></div>
      </div>
      <div class="foot"><span class="hint"><span class="kbd">←</span><span class="kbd">→</span>Choose</span><span class="sp"></span><span class="hint"><span class="kbd">↵</span>Switch</span></div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">Opened from the avatar in the launcher's bottom bar.</div>
    <div class="note">Not decided: the design of this screen, where the avatars are on the machine, and whether a password is asked.</div>
  </div>
</figure>

<!-- 9 -->
<figure class="screen">
  <figcaption>
    <h2>9. When home cannot be reached</h2>
    <p>Quiet: a slim plain bar under the top bar. Saved content stays usable.</p>
  </figcaption>
  <div class="frames"><div class="frame f wallpaper compact light">
    <div class="window glass w-list">
      <div class="search"><span class="ico"></span><span class="t-3">Search commands, views and clipboard</span></div>
      <div class="quietbar"><span class="dot"></span><span class="grow">Home cannot be reached. Showing saved content.</span></div>
      <div class="list-pane">
        <div class="row is-selected"><span class="ico"></span><span class="grow">Clipboard</span><span class="kbd">Ctrl ⇧ V</span></div>
        <div class="row"><span class="ico"></span><span class="grow">Notifications</span></div>
        <div class="row is-disabled"><span class="ico"></span><span class="grow">Ask Juno</span></div>
      </div>
    </div>
  </div></div>
  <div class="notes">
    <div class="note">The bar is plain, not glass, and is the only sign. Rows that need home are dimmed.</div>
    <div class="note">While waiting for a reply, a thin accent line sits under the top bar and the last content stays. Not decided: which views work offline.</div>
  </div>
</figure>

</div>
</div>
</body>
</html>
