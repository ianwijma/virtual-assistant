<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice page mockups</title>
<link rel="stylesheet" href="../examples/tokens.css"><link rel="stylesheet" href="../examples/components.css"><link rel="stylesheet" href="mockup.css">
<style>
body { background: var(--bg); }
.frame { box-shadow: var(--shadow-3); color: var(--text); }
.frame.vph { width: 270px; height: 560px; border-radius: 32px; }
.frame.vpt { width: 590px; height: 400px; border-radius: 24px; }
.frame > * { position: absolute; }
.screen.wide .body { display: flex; gap: 24px; align-items: flex-start; }
.screen.wide .notes { width: 300px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
.screen.cell { min-width: 0; }
.screen.cell .notes { max-width: none; }
.note { font: var(--type-label); color: var(--text-2); }
.glow { border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 55%, transparent), transparent); }
.cx { left: 0; right: 0; margin: 0 auto; width: max-content; }
.nm { font: var(--type-body-strong); }
.top-id { left: 0; right: 0; text-align: center; }
.st { display: flex; align-items: center; justify-content: center; gap: 6px; font: var(--type-label); color: var(--text-2); }
.st .dot { color: var(--accent); }
.cap-line { left: 20px; right: 20px; text-align: center; font: 500 13px/18px var(--font-sans); color: var(--text-2); }
.cap-line.strong { font: 600 16px/22px var(--font-sans); color: var(--text); }
.setup { top: 14px; right: 16px; font: var(--type-caption); color: var(--text-2); text-decoration: underline; }
.setup.left { right: auto; left: 16px; top: 18px; }
.talk { left: 50%; transform: translateX(-50%); height: 44px; padding: 0 var(--s-6); border-radius: var(--r-full); width: max-content; }
.ctls { left: 0; right: 0; display: flex; justify-content: center; align-items: flex-end; }
.ctl { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cap { font: var(--type-caption); color: var(--text-2); }
.rb { border-radius: 50%; display: grid; place-items: center; flex: none; }
.danger-fill { background: var(--danger); color: var(--on-accent); border: 0; }
.handle { width: 36px; height: 5px; border-radius: var(--r-full); background: var(--line); border: 1px solid var(--text-3); box-sizing: border-box; flex: none; align-self: center; }
.sheet { left: 12px; right: 12px; border-radius: var(--r-xl); display: flex; flex-direction: column; gap: 8px; padding: 8px var(--s-4) 0; overflow: hidden; }
.say { font: 500 15px/20px var(--font-sans); }
.cl .row { min-height: 32px; padding: 0 var(--s-1); font: 14px/20px var(--font-sans); }
.cl-t { font: var(--type-body-strong); margin-bottom: 2px; }
.fold { left: 8px; right: 8px; top: 20px; height: 74px; border-radius: var(--r-xl); display: flex; align-items: center; gap: 8px; padding: 0 10px; }
.lvl { display: flex; align-items: center; gap: 3px; height: 20px; }
.lvl i { width: 3px; border-radius: 2px; background: var(--accent); display: block; }
.th-box { left: 14px; right: 14px; top: 106px; bottom: 84px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; overflow: hidden; }
.th-box .bubble { font: 14px/20px var(--font-sans); max-width: 86%; }
.card-in { padding: var(--s-2) var(--s-3); }
.bar { left: 12px; right: 12px; bottom: 14px; height: 56px; display: flex; align-items: center; gap: var(--s-2); padding: 0 10px; border-radius: var(--r-xl); }
.bar .field { flex: 1; min-width: 0; height: 38px; font-size: 14px; padding: 0 var(--s-3); }
.bar .field .ph { white-space: nowrap; }
.pane { left: 20px; right: 20px; top: 90px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.msg { left: 24px; right: 24px; text-align: center; }
.warn { top: 84px; left: 0; right: 0; display: flex; align-items: center; gap: var(--s-2); padding: 9px var(--s-4); background: var(--surface-2); border-bottom: 2px solid var(--warning); font: var(--type-label); }
.warn .w { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); flex: none; }
.grow { flex: 1; min-width: 0; }
</style></head>
<body class="va"><div class="mock-page">
<header><h1>Voice page</h1><p>Phone frames are 270 by 560, tablet frames 590 by 400, roomy density. The voice page reuses the phone app's call; only what the page adds is new.</p></header>
<figure class="screen wide"><figcaption><h2>1. Before sign-in</h2><p>The page as first opened: it is already the call, with the guest assistant.</p></figcaption><div class="body"><div class="frames"><div class="frame vph backdrop dark accent-tide "><div class="glow" style="width:340px;height:340px;left:-45px;top:40px"></div><div class="setup">Set up this device</div><div class="top-id" style="top:40px"><div class="nm">Juno</div><div class="st"><span class="dot"></span>Guest</div></div><span class="figure cx" style="--size:150px;top:90px"><span class="character " style="--size:150px"></span></span><div class="cap-line strong" style="top:380px">Tap and say what you need.</div><span class="btn btn-primary talk" style="top:430px">Tap to talk</span><div class="cap-line" style="top:496px">Guests get guest-level answers.</div></div><div class="frame vpt backdrop light accent-tide "><div class="glow" style="width:300px;height:300px;left:145px;top:10px"></div><div class="setup">Set up this device</div><div class="top-id" style="top:16px"><div class="nm">Juno</div><div class="st"><span class="dot"></span>Guest</div></div><span class="figure cx" style="--size:100px;top:66px"><span class="character " style="--size:100px"></span></span><div class="cap-line strong" style="top:270px">Tap and say what you need.</div><span class="btn btn-primary talk" style="top:304px">Tap to talk</span><div class="cap-line" style="top:358px">Guests get guest-level answers.</div></div></div><div class="notes"><div class="note">The figure has the screen, as on the phone. The one primary button starts the call and asks the browser for the microphone.</div><div class="note">A plain line says guests get guest-level answers. A plain "Set up this device" text sits at the top right. Not decided: where the guest note and the set-up choice sit.</div><div class="note">Sign-in is not decided. The tablet frame is the same layout on a wide screen. Not decided: whether wide screens use the tablet stage instead.</div></div></div></figure><figure class="screen wide"><figcaption><h2>3. The call with the whole figure</h2><p>The same call as the phone app: the figure, what is heard, and two round buttons.</p></figcaption><div class="body"><div class="frames"><div class="frame vph backdrop dark accent-aurora "><div class="glow" style="width:340px;height:340px;left:-45px;top:40px"></div><div class="top-id" style="top:40px"><div class="nm">Juno</div><div class="st"><span class="dot"></span>Listening &middot; 02:14</div></div><span class="figure cx" style="--size:150px;top:90px"><span class="character listening" style="--size:150px"></span></span><div class="cap-line strong" style="top:392px">&ldquo;Put milk and eggs on the shopping list&rdquo;</div><div class="ctls" style="bottom:24px;gap:44px"><span class="ctl"><span class="rb glass" style="width:56px;height:56px"><i class="ico"></i></span><span class="cap">Chat</span></span><span class="ctl"><span class="rb danger-fill" style="width:56px;height:56px"><i class="ico"></i></span><span class="cap">End</span></span></div></div><div class="frame vpt backdrop light accent-moss "><div class="glow" style="width:300px;height:300px;left:145px;top:0px"></div><div class="top-id" style="top:16px"><div class="nm">Juno</div><div class="st"><span class="dot"></span>Listening &middot; 02:14</div></div><span class="figure cx" style="--size:100px;top:66px"><span class="character listening" style="--size:100px"></span></span><div class="cap-line strong" style="top:270px">&ldquo;Put milk and eggs on the shopping list&rdquo;</div><div class="ctls" style="bottom:14px;gap:44px"><span class="ctl"><span class="rb glass" style="width:48px;height:48px"><i class="ico"></i></span><span class="cap">Chat</span></span><span class="ctl"><span class="rb danger-fill" style="width:48px;height:48px"><i class="ico"></i></span><span class="cap">End</span></span></div></div></div><div class="notes"><div class="note">The figure has most of the screen. Under it the name and the state in words with the call time.</div><div class="note">What the person says appears under the figure as a live line. The state is never shown by motion alone.</div><div class="note">Two round buttons: Chat folds the call into the chat, End ends the call (red). No primary button; the page listens on its own.</div></div></div></figure><div class="grid3"><figure class="screen cell"><figcaption><h2>2. The set-up choice</h2><p>Personal or household device.</p></figcaption><div class="frames"><div class="frame vph backdrop light accent-ember "><div class="glow" style="width:300px;height:300px;left:-15px;top:-40px"></div><div class="setup left">Back</div><div class="pane"><span class="character" style="--size:64px"></span><div class="t-title" style="margin-top:var(--s-3)">Set up this device</div><div class="t-label t-2">Choose how this page is used.</div><div class="surface list" style="width:100%;margin-top:var(--s-4)"><div class="row"><i class="ico"></i><div class="grow"><span class="t-strong">Personal device</span><span class="sub">Only you use it.</span></div></div><div class="row"><i class="ico"></i><div class="grow"><span class="t-strong">Household device</span><span class="sub">Anyone at home uses it.</span></div></div></div><div class="t-caption t-2" style="margin-top:var(--s-4)">Or keep talking as a guest.</div></div></div></div><div class="notes"><div class="note">Two plain rows on a surface under a title. Personal leads to sign-in; household leads to the invite and approval.</div><div class="note">Not decided: how this is reached and drawn, and sign-in itself. This is the plainest form, not a design.</div></div></figure><figure class="screen cell"><figcaption><h2>4. A card shown as a sheet</h2><p>Something the assistant shows during the call.</p></figcaption><div class="frames"><div class="frame vph backdrop light accent-tide "><div class="glow" style="width:300px;height:300px;left:-25px;top:20px"></div><div class="top-id" style="top:40px"><div class="nm">Juno</div><div class="st"><span class="dot"></span>Speaking &middot; 02:14</div></div><span class="figure cx" style="--size:80px;top:84px"><span class="character " style="--size:80px"></span></span><div class="glass-thick sheet" style="top:244px;height:190px"><span class="handle"></span><div class="say">Done. I added milk and eggs.</div><div class="cl"><div class="cl-t">Shopping</div><div class="list"><div class="row"><i class="ico"></i><span class="grow">Bread</span></div><div class="row"><i class="ico"></i><span class="grow">Milk</span><span class="chip accent">New</span></div><div class="row"><i class="ico"></i><span class="grow">Eggs</span><span class="chip accent">New</span></div></div></div></div><div class="ctls" style="bottom:18px;gap:44px"><span class="ctl"><span class="rb glass" style="width:44px;height:44px"><i class="ico"></i></span></span><span class="ctl"><span class="rb danger-fill" style="width:44px;height:44px"><i class="ico"></i></span></span></div></div></div><div class="notes"><div class="note">The figure shrinks and moves up. A glass sheet lifts over the middle with the reply and the card as compact rows.</div><div class="note">The Chat and End buttons stay at the bottom. The sheet leaves when the call ends or the assistant clears it.</div></div></figure><figure class="screen cell"><figcaption><h2>5. The call folded into chat</h2><p>The figure shrinks into a glass header above the live conversation.</p></figcaption><div class="frames"><div class="frame vph backdrop dark accent-aurora "><div class="glow" style="width:260px;height:260px;left:-5px;top:-70px"></div><div class="glass fold"><span class="character listening" style="--size:52px"></span><div style="flex:1;min-width:0"><div class="nm">Juno</div><span class="lvl"><i style="height:8px"></i><i style="height:14px"></i><i style="height:20px"></i><i style="height:12px"></i><i style="height:18px"></i><i style="height:9px"></i><i style="height:15px"></i><i style="height:6px"></i></span></div><span class="ctl"><span class="rb glass" style="width:32px;height:32px"><i class="ico"></i></span></span><span class="ctl"><span class="rb danger-fill" style="width:32px;height:32px"><i class="ico"></i></span></span></div><div class="th-box"><div class="bubble">Hi Sam. What can I do?</div><div class="bubble me">Put milk and eggs on the shopping list</div><div class="bubble">Done. I added milk and eggs.</div><div class="surface card-in"><div class="cl"><div class="cl-t">Shopping</div><div class="list"><div class="row"><i class="ico"></i><span class="grow">Bread</span></div><div class="row"><i class="ico"></i><span class="grow">Milk</span><span class="chip accent">New</span></div><div class="row"><i class="ico"></i><span class="grow">Eggs</span><span class="chip accent">New</span></div></div></div></div></div><div class="glass bar"><span class="field"><span class="ph">Message Juno</span></span><span class="btn btn-primary btn-icon" style="width:36px;height:36px;border-radius:50%;flex:none"><i class="ico"></i></span></div></div></div><div class="notes"><div class="note">The header holds a small figure, the name, a sound level and two small buttons: Mute and End.</div><div class="note">Below, the chat updates live; a card sits in it as a plain row list. A glass bar at the bottom takes typed messages.</div></div></figure><figure class="screen cell"><figcaption><h2>6. Without blur</h2><p>The call on an old tablet whose browser cannot blur.</p></figcaption><div class="frames"><div class="frame vph backdrop light accent-aurora no-blur"><div class="glow" style="width:340px;height:340px;left:-45px;top:40px"></div><div class="top-id" style="top:40px"><div class="nm">Juno</div><div class="st"><span class="dot"></span>Listening &middot; 02:14</div></div><span class="figure cx" style="--size:150px;top:90px"><span class="character " style="--size:150px"></span></span><div class="cap-line strong" style="top:392px">&ldquo;Put milk and eggs on the shopping list&rdquo;</div><div class="ctls" style="bottom:24px;gap:44px"><span class="ctl"><span class="rb glass" style="width:56px;height:56px"><i class="ico"></i></span><span class="cap">Chat</span></span><span class="ctl"><span class="rb danger-fill" style="width:56px;height:56px"><i class="ico"></i></span><span class="cap">End</span></span></div></div></div><div class="notes"><div class="note">Class no-blur: glass becomes a flat tint with the same edge and shape. The page detects this by itself.</div><div class="note">Motion is reduced too: the figure does not breathe, and changes fade. The state stays in words.</div></div></figure><figure class="screen cell"><figcaption><h2>7. Microphone blocked</h2><p>The page cannot listen.</p></figcaption><div class="frames"><div class="frame vph backdrop dark accent-ember "><div class="glow" style="width:300px;height:300px;left:-15px;top:40px"></div><div class="top-id" style="top:40px"><div class="nm">Juno</div><div class="st"><span class="dot"></span>Cannot hear</div></div><span class="figure cx" style="--size:110px;top:96px"><span class="character muted" style="--size:110px"></span></span><div class="msg" style="top:318px"><div class="t-heading">Juno cannot hear you</div><div class="t-label t-2" style="margin-top:4px">Allow the microphone in your browser, then try again.</div></div><span class="btn btn-primary talk" style="top:420px">Try again</span></div></div><div class="notes"><div class="note">A muted figure, one sentence on what to do, and one primary button, Try again.</div><div class="note">Shown when permission is denied, the address is not https, or the page was hidden. It clears when listening resumes.</div></div></figure><figure class="screen cell"><figcaption><h2>8. Home cannot be reached</h2><p>A quiet bar, not a card.</p></figcaption><div class="frames"><div class="frame vph backdrop light accent-tide "><div class="glow" style="width:300px;height:300px;left:-15px;top:40px"></div><div class="top-id" style="top:40px"><div class="nm">Juno</div><div class="st"><span class="dot"></span>Away from home</div></div><div class="warn"><span class="w"></span><div class="grow"><b>Can&rsquo;t reach home.</b> <span class="t-2">Showing what was saved at 14:02.</span></div></div><span class="figure cx" style="--size:110px;top:150px"><span class="character muted" style="--size:110px"></span></span><div class="msg" style="top:366px"><div class="t-label t-2">Calls need home. The last chat can still be read.</div></div><span class="btn btn-primary talk" style="top:410px">Try again</span><div class="ctls" style="bottom:22px;gap:0px"><span class="ctl"><span class="rb glass" style="width:48px;height:48px"><i class="ico"></i></span><span class="cap">Chat</span></span></div></div></div><div class="notes"><div class="note">A slim plain bar under the top bar says home cannot be reached and what is shown. The figure is muted.</div><div class="note">The saved chat stays readable through Chat. Try again is the one primary button.</div></div></figure></div></div></body></html>
