<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice page mockups</title>
<link rel="stylesheet" href="../examples/tokens.css"><link rel="stylesheet" href="../examples/components.css"><link rel="stylesheet" href="mockup.css">
<style>
body { background: var(--bg); }
.vp { position: absolute; inset: 0; padding: var(--s-8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-6); text-align: center; }
.mic { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; }
.mic .ico { width: 32px; height: 32px; opacity: 1; border-radius: 12px; }
.pill { display: flex; gap: var(--s-3); padding: var(--s-2); border-radius: var(--r-full); }
.pill .btn { height: 48px; border-radius: var(--r-full); padding: 0 var(--s-6); }
.transcript { font: var(--type-display); max-width: 760px; }
.state { font: var(--type-heading); color: var(--text-2); }
.corner { position: absolute; top: var(--s-6); right: var(--s-6); }
.corner-b { position: absolute; bottom: var(--s-6); left: 50%; transform: translateX(-50%); }
.side-by { position: absolute; inset: 0; padding: var(--s-8); display: flex; align-items: center; gap: var(--s-8); }
.cardbig { flex: 1; max-width: 560px; padding: var(--s-6); display: flex; flex-direction: column; gap: var(--s-3); }
.ck { display: flex; align-items: center; gap: var(--s-3); font: var(--type-heading); min-height: 48px; }
.ck + .ck { border-top: 1px solid var(--line); }
.ck .ico { width: 24px; height: 24px; border-radius: 50%; }
.ck.done { color: var(--text-3); text-decoration: line-through; }
.sheet { width: 720px; height: 620px; display: flex; flex-direction: column; padding: var(--s-4); gap: var(--s-3); }
.sheet-h { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2); }
.msgs { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-2); overflow: hidden; }
.msgs { text-align: left; }
.msgs .bubble { font: var(--type-body); align-self: flex-start; }
.msgs .bubble.me { align-self: flex-end; }
.compose { display: flex; gap: var(--s-2); }
.compose .field { flex: 1; }
.state-card { width: 600px; padding: var(--s-8); display: flex; flex-direction: column; align-items: center; gap: var(--s-4); text-align: center; }
.reasons { width: 100%; text-align: left; display: flex; flex-direction: column; }
.reasons .row { align-items: flex-start; padding-top: var(--s-3); padding-bottom: var(--s-3); }
</style></head>
<body class="va"><div class="mock-page">
<header><h1>Voice page</h1><p>The light web page for talking to an assistant from any browser, often an old tablet, drawn at 1024 by 700 in roomy density.</p></header>
<figure class="screen"><figcaption><h2>1. Before sign-in</h2><p>The page as first opened: it already talks to the guest assistant.</p></figcaption><div class="frames"><div class="frame tablet backdrop "><div class="vp"><span class="character" style="--size:160px"></span>
 <div><div class="t-display">Talk to Juno as a guest</div><div class="state" style="margin-top:var(--s-2)">Tap the microphone and say what you need.</div></div>
 <button class="btn btn-primary mic"><span class="ico"></span></button>
 <div class="pill glass"><button class="btn btn-quiet">Use as a personal device</button><button class="btn btn-quiet">Use as a household device</button></div></div></div></div><div class="notes"><div class="note">Centre: the character of the guest assistant at 160px (idle), the title "Talk to Juno as a guest" and one line of help. Guests get guest-level answers only.</div><div class="note">The large round microphone button is the one primary action. Tapping it asks the browser for microphone permission, then opens the voice view.</div><div class="note">The two quiet choices sit in a glass pill below. Personal device leads to email and one-time code sign-in; Household device leads to the invite and admin approval flow.</div></div></figure><figure class="screen"><figcaption><h2>2. Voice view, listening</h2><p>The page while the assistant hears the person.</p></figcaption><div class="frames"><div class="frame tablet backdrop "><div class="vp"><span class="character listening" style="--size:260px"></span>
 <div class="state">Listening</div><div class="transcript">Add milk and eggs to the shopping list</div></div>
 <div class="corner-b glass pill"><button class="btn btn-quiet">Show as text</button></div></div></div><div class="notes"><div class="note">Centre: the character at 260px with the listening state (it breathes). Under it, the state in words: Idle, Listening, Thinking, Speaking, Muted or Waiting. State is never shown by animation alone.</div><div class="note">The live transcript is in large type and fills in word by word while the person talks. It is replaced by the next utterance.</div><div class="note">"Show as text" (glass pill, bottom centre) switches to the chat view. There is no primary button here; the page listens on its own.</div></div></figure><figure class="screen"><figcaption><h2>3. Voice view with a described screen</h2><p>The assistant presents something: here a shopping list.</p></figcaption><div class="frames"><div class="frame tablet backdrop "><div class="side-by"><div class="col" style="align-items:center;gap:var(--s-3);width:220px"><span class="character" style="--size:150px"></span><div class="state">Speaking</div></div>
 <div class="cardbig glass"><div class="card-head" style="margin:0"><span class="t-title" style="flex:1">Shopping list</span><span class="chip">4 items</span></div>
  <div><div class="ck"><span class="ico"></span>Milk</div><div class="ck"><span class="ico"></span>Eggs</div><div class="ck"><span class="ico"></span>Bread</div><div class="ck done"><span class="ico"></span>Butter</div></div>
  <div class="t-label t-2">Added by Juno for Sam, just now</div></div></div>
 <div class="corner glass pill"><button class="btn btn-quiet">Show as text</button></div></div></div><div class="notes"><div class="note">The character shrinks to 150px and moves to the left; its state text stays under it so the person always knows if it hears or speaks.</div><div class="note">The described screen is a glass card on the backdrop, built from A2UI components: here a title, a count chip and checklist rows. A notification card has the same shape with actions at the bottom.</div><div class="note">The card appears with the assistant's reply and leaves when the conversation ends or the assistant clears it. Touching a row of an interactive card acts on it.</div></div></figure><figure class="screen"><figcaption><h2>4. Chat view</h2><p>The conversation as text, updating live.</p></figcaption><div class="frames"><div class="frame tablet backdrop dark"><div class="vp"><div class="sheet glass-thick"><div class="sheet-h"><span class="character" style="--size:40px"></span><div class="grow t-heading" style="flex:1">Juno</div><button class="btn">Show voice view</button></div><hr class="divider">
 <div class="msgs"><div class="bubble">Hello Sam. What can I do for you?</div><div class="bubble me">Add milk and eggs to the shopping list</div><div class="bubble">Done. I added milk and eggs. You now have four items.</div><div class="bubble me">What is on it?</div><div class="bubble">Milk, eggs, bread and butter.</div></div>
 <div class="compose"><div class="field"><span class="ph">Type a message</span></div><button class="btn btn-primary">Send</button></div></div></div></div></div><div class="notes"><div class="note">A glass sheet centred on the backdrop holds the conversation. Assistant messages are plain bubbles on the left; the person's are accent bubbles on the right. New text appears live while the person talks or the assistant answers, and the list scrolls to the newest.</div><div class="note">The field at the bottom is for typing. When the person types, the assistant answers in text only and does not speak; speaking returns when the person goes back to the voice view and talks.</div><div class="note">"Show voice view" returns to the character. This frame is drawn in dark; the page follows the device's light or dark setting.</div></div></figure><figure class="screen"><figcaption><h2>5. No blur fallback</h2><p>Screen 2 on an old tablet whose browser cannot blur.</p></figcaption><div class="frames"><div class="frame tablet backdrop no-blur reduced-motion"><div class="vp"><span class="character" style="--size:260px"></span>
 <div class="state">Listening</div><div class="transcript">Add milk and eggs to the shopping list</div></div>
 <div class="corner-b glass pill"><button class="btn btn-quiet">Show as text</button></div></div></div><div class="notes"><div class="note">The same layout as screen 2. Glass becomes a flat translucent tint in the same colour and shape, with the same edge but no blur. The page detects missing backdrop-filter support and switches by itself.</div><div class="note">Motion is reduced as well: the character no longer breathes, and changes happen with a short fade instead of slides. The state is still written in words.</div><div class="note">Nothing else changes: it is the same look with less effect, not another theme.</div></div></figure><figure class="screen"><figcaption><h2>6. Microphone blocked or page hidden</h2><p>The state card shown when the page cannot listen.</p></figcaption><div class="frames"><div class="frame tablet backdrop "><div class="vp"><div class="state-card glass-thick"><span class="character muted" style="--size:96px"></span>
 <div class="t-title">Juno cannot hear you</div><div class="t-2">The page needs the microphone, and it only listens while it is visible.</div>
 <div class="reasons"><div class="row"><span class="ico"></span><div class="grow"><span class="t-strong">Allow the microphone</span><span class="sub">Your browser asks once. Choose Allow in the address bar, then try again.</span></div></div>
 <div class="row"><span class="ico"></span><div class="grow"><span class="t-strong">Use a secure address</span><span class="sub">Browsers only share the microphone on https. Open the page from the address that starts with https.</span></div></div>
 <div class="row"><span class="ico"></span><div class="grow"><span class="t-strong">Keep this page open</span><span class="sub">When the page is hidden or the screen is off, listening stops until you come back.</span></div></div></div>
 <button class="btn btn-primary">Try again</button></div></div></div></div><div class="notes"><div class="note">One glass state card, centred, with a muted character (grey) above. The title says the assistant cannot hear; the list gives each possible cause with what to do, and the page marks the cause it detected.</div><div class="note">Shown when the microphone permission is denied, when the page is not served over HTTPS, and when the page is hidden. For a hidden page it is shown on return and clears itself once listening resumes.</div><div class="note">Try again asks for the microphone again; it is the one primary action. The card appears over the voice view and replaces nothing else.</div></div></figure>
</div></body></html>
