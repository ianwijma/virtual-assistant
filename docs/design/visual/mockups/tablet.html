<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household tablet, kiosk</title>
<link rel="stylesheet" href="../examples/tokens.css">
<link rel="stylesheet" href="../examples/components.css">
<link rel="stylesheet" href="mockup.css">
<style>
  /* Layout only. Frames are drawn at about 590 by 400, roomy density scaled to fit. */
  .grid { display: grid; grid-template-columns: 590px 590px; gap: 28px 20px; }
  .grid > .screen { width: 590px; gap: 8px; }
  .frame.tab { width: 590px; height: 400px; border-radius: 20px; }
  .frame.tab > * { position: absolute; }
  .screen > figcaption h2 { font: var(--type-strong); }
  .screen > figcaption p { font: var(--type-caption); }
  .note { font: var(--type-caption); color: var(--text-2); }
  .shadow { text-shadow: 0 2px 18px var(--bg), 0 0 4px var(--bg); }
  .clock { left: var(--s-6); top: var(--s-4); line-height: 1; }
  .clock .t-display-xl { font-size: 80px; }
  .shelf { left: 12px; right: 12px; bottom: 12px; height: 56px; border-radius: var(--r-lg); }
  .on-shelf { left: 28px; bottom: 68px; }
  .bars { right: 28px; bottom: 20px; display: flex; gap: 6px; }
  .sb { display: flex; align-items: center; gap: 6px; width: 140px; height: 40px; padding: 0 var(--s-2);
    border-radius: var(--r-sm); background: var(--control); font-size: 12px; line-height: 14px; font-weight: 600; }
  .sb .ico { width: 14px; height: 14px; flex: none; }
  .floor { left: 20px; width: 200px; bottom: 6px; height: 20px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.5), transparent); }
  .stagefig { left: 50px; bottom: 22px; }
  .col { left: 250px; right: var(--s-4); top: var(--s-4); bottom: var(--s-4); padding: var(--s-5); display: flex; flex-direction: column; justify-content: center; gap: var(--s-2); }
  .state { font: 600 28px/34px var(--font-sans); letter-spacing: -.01em; }
  .say { font: 500 22px/28px var(--font-sans); }
  .crow { display: flex; align-items: center; gap: var(--s-3); min-height: 48px; padding: 0 var(--s-1); font: var(--type-label); font-weight: 600; }
  .crow + .crow { border-top: 1px solid var(--line); }
  .crow .grow { flex: 1; min-width: 0; }
  .crow .t-2 { font-weight: 500; }
  .dimmer { inset: 0; background: color-mix(in srgb, var(--bg) 55%, transparent); }
  .sheetbox { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 340px; padding: var(--s-5); display: flex; flex-direction: column; align-items: center; gap: var(--s-3); text-align: center; }
  .sheetbox .acts { display: flex; gap: var(--s-3); width: 100%; margin-top: var(--s-2); }
  .sheetbox .acts .btn { flex: 1; height: 52px; }
  .topline { left: 0; right: 0; top: 0; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s-5); }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--accent); }
  .pane { left: 50%; top: 56px; bottom: var(--s-6); transform: translateX(-50%); width: 400px; padding: var(--s-6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-3); text-align: center; }
  .codes { display: flex; gap: var(--s-2); }
  .codes > span { width: 44px; height: 56px; display: grid; place-items: center; border-radius: var(--r-md); background: var(--control); border: 1px solid var(--line); font: 600 24px/1 var(--font-sans); }
  .codes > span.cur { outline: 2px solid var(--accent); }
  .lowpower { display: flex; align-items: center; justify-content: center; }
  .lowpower > * { position: static; }
  .lowpower .t-display-xl { font-size: 80px; }
  .plainbar { left: 0; right: 0; top: 0; height: 30px; display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-5); background: var(--surface); border-bottom: 1px solid var(--line); font: var(--type-caption); font-weight: 600; }
  .plainbar .w { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); flex: none; }
  .plainbar .grow { flex: 1; }
</style>
</head>
<body class="va">
<div class="mock-page">
<header>
  <h1>Household tablet, kiosk</h1>
  <p>A tablet in a room, left running as a voice device for everyone. Landscape, roomy density, readable from across a room. Frames are drawn at about 590 by 400 so that two fit in a row; text sizes are scaled to match. Light and dark frames are mixed to show both.</p>
</header>

<div class="grid">

<!-- 1 -->
<figure class="screen">
  <figcaption><h2>1. Idle with a wallpaper</h2><p>A photo, a clock, a shelf of glance bars and the figure standing on the shelf.</p></figcaption>
  <div class="frame tab wallpaper light">
    <div class="clock shadow"><div class="t-display-xl num">9:41</div><div class="t-strong" style="margin-top:6px">Saturday 28 November</div></div>
    <div class="glass shelf"></div>
    <div class="on-shelf"><span class="figure" style="--size:80px"><span class="character" style="--size:80px"></span></span></div>
    <div class="bars">
      <div class="sb"><span class="ico"></span><span>Pasta &middot; 07:42</span></div>
      <div class="sb"><span class="ico"></span><span>Bins go out tonight</span></div>
      <div class="sb"><span class="ico"></span><span>Shopping &middot; 3 items</span></div>
    </div>
  </div>
  <div class="note">Photo (a stand-in here): fills the screen and stays clear. Clock: large, top left, on the photo.</div>
  <div class="note">Shelf: slim glass along the bottom. The figure stands on its left end; the glance bars (flat, one fact each, a card in closed form) sit at the right. Touching a bar opens its card as a sheet (4). No written hint is shown on how to call the assistant.</div>
  <div class="note">Not decided: whether the clock moves to protect the screen; which figure shows when there are several assistants; whether the figure stays at night.</div>
</figure>

<!-- 2 -->
<figure class="screen">
  <figcaption><h2>2. Listening (the stage)</h2><p>Our own backdrop replaces the photo. The whole figure is on the left, a glass column on the right.</p></figcaption>
  <div class="frame tab backdrop dark">
    <div class="floor"></div>
    <div class="stagefig"><span class="figure" style="--size:140px"><span class="character listening" style="--size:140px"></span></span></div>
    <div class="glass col">
      <div class="t-caption">Juno</div>
      <div class="state">Listening</div>
      <div class="say">Add milk to the shopping list</div>
    </div>
  </div>
  <div class="note">Figure: stands on a soft floor shadow and breathes while it listens. Column (glass): the assistant's name, the state word, then the words heard so far, growing as the person speaks.</div>
  <div class="note">There are no buttons. With no card to show, the figure can walk across the screen. Not decided: how long the stage stays before the idle screen returns.</div>
</figure>

<!-- 3 -->
<figure class="screen">
  <figcaption><h2>3. An answer with card rows</h2><p>The same stage. The column holds a list of compact rows.</p></figcaption>
  <div class="frame tab backdrop light">
    <div class="floor"></div>
    <div class="stagefig"><span class="figure" style="--size:140px"><span class="character" style="--size:140px"></span></span></div>
    <div class="glass col" style="justify-content:flex-start">
      <div class="t-caption">Juno</div>
      <div class="state">Here is what is running</div>
      <div style="margin-top:var(--s-2)">
        <div class="crow"><span class="ico"></span><span class="grow">Pasta timer</span><span class="num t-2">07:42</span></div>
        <div class="crow"><span class="ico"></span><span class="grow">Shopping list</span><span class="t-2">3 items</span></div>
        <div class="crow"><span class="ico"></span><span class="grow">New email from Sam</span><span class="t-2">9:30</span></div>
      </div>
    </div>
  </div>
  <div class="note">Each card (a timer, a list, a notification, a question to approve) is one compact row with an icon, a title and one fact. The rows are plain inside the glass column. A touch on a row lifts it into a sheet (4).</div>
  <div class="note">The answer is spoken aloud as well, so the screen is never the only answer. Not decided: how many rows show before the list scrolls.</div>
</figure>

<!-- 4 -->
<figure class="screen">
  <figcaption><h2>4. A card lifted into a sheet</h2><p>A touch on the timer row opens it as a sheet over the dimmed screen.</p></figcaption>
  <div class="frame tab backdrop dark">
    <div class="floor"></div>
    <div class="stagefig"><span class="figure" style="--size:140px"><span class="character" style="--size:140px"></span></span></div>
    <div class="glass col" style="justify-content:flex-start">
      <div class="t-caption">Juno</div>
      <div class="state">Here is what is running</div>
      <div style="margin-top:var(--s-2)">
        <div class="crow"><span class="ico"></span><span class="grow">Pasta timer</span><span class="num t-2">07:42</span></div>
        <div class="crow"><span class="ico"></span><span class="grow">Shopping list</span><span class="t-2">3 items</span></div>
        <div class="crow"><span class="ico"></span><span class="grow">New email from Sam</span><span class="t-2">9:30</span></div>
      </div>
    </div>
    <div class="dimmer"></div>
    <div class="glass-thick sheetbox">
      <span class="t-caption">Pasta timer &middot; Kitchen</span>
      <span class="t-display-xl num" style="font-size:64px">07:42</span>
      <div class="acts"><span class="btn btn-primary">Stop</span><span class="btn">Add 1 minute</span></div>
    </div>
  </div>
  <div class="note">Sheet (thick glass): floats over the middle of the dimmed screen. It grows from the row that was touched, and its title stays and moves into place. The one primary button is Stop.</div>
  <div class="note">A touch outside the sheet closes it and it shrinks back into its row. Not decided: the buttons each kind of card has.</div>
</figure>

<!-- 5 -->
<figure class="screen">
  <figcaption><h2>5. A recognised person</h2><p>The screen takes the speaker's own accent for the conversation.</p></figcaption>
  <div class="frame tab backdrop light accent-ember">
    <div class="floor"></div>
    <div class="stagefig"><span class="figure" style="--size:140px"><span class="character" style="--size:140px"></span></span></div>
    <div class="glass col" style="justify-content:flex-start">
      <div class="hstack" style="gap:var(--s-2)"><span class="t-caption" style="flex:1">Juno</span><span class="chip accent" style="height:30px;padding:0 var(--s-3) 0 var(--s-1)"><span class="avatar" style="width:22px;height:22px">A</span>Alex</span></div>
      <div class="state">Your reminders</div>
      <div style="margin-top:var(--s-2)">
        <div class="crow"><span class="ico"></span><span class="grow">Call the plumber</span><span class="t-2">10:00</span></div>
        <div class="crow"><span class="ico"></span><span class="grow">Pasta timer</span><span class="num t-2">07:42</span></div>
      </div>
    </div>
  </div>
  <div class="note">Same stage as 3. The frame uses another accent class (Ember, as Alex's own) instead of the household's, so the backdrop, the figure's accent and chips change colour.</div>
  <div class="note">The chip shows who the assistant thinks is speaking, so a wrong match is easy to spot. When the conversation ends the accent returns to the household's. Not decided: how a wrong match is corrected.</div>
</figure>

<!-- 6 -->
<figure class="screen">
  <figcaption><h2>6. An approval prompt</h2><p>The question is a card row that opens as a sheet at once.</p></figcaption>
  <div class="frame tab backdrop dark accent-ember">
    <div class="floor"></div>
    <div class="stagefig"><span class="figure" style="--size:140px"><span class="character" style="--size:140px"></span></span></div>
    <div class="glass col" style="justify-content:flex-start">
      <div class="t-caption">Juno</div>
      <div class="state">Juno asks</div>
      <div class="crow" style="margin-top:var(--s-2)"><span class="ico"></span><span class="grow">Send the list to Sam?</span></div>
    </div>
    <div class="dimmer"></div>
    <div class="glass-thick sheetbox">
      <span class="t-heading" style="font-weight:600">Send this to Sam's phone?</span>
      <span class="t-label t-2">The shopping list, 3 items</span>
      <div class="acts"><span class="btn btn-primary">Yes</span><span class="btn">No</span></div>
    </div>
  </div>
  <div class="note">A question to approve is a row like any other card, lifted into a sheet. Yes is the one primary button, No is plain; "yes" and "no" spoken do the same. The question is read aloud when the sheet opens.</div>
  <div class="note">Not decided: the time before an unanswered question counts as No; who may approve which actions.</div>
</figure>

<!-- 7 -->
<figure class="screen">
  <figcaption><h2>7. An unrecognised voice</h2><p>The assistant says it does not know the voice. The stage is neutral.</p></figcaption>
  <div class="frame tab backdrop light">
    <div class="floor"></div>
    <div class="stagefig"><span class="figure" style="--size:140px"><span class="character muted" style="--size:140px"></span></span></div>
    <div class="glass col">
      <div class="t-caption">Juno</div>
      <div class="state">I don't recognise your voice</div>
      <div class="t-label t-2">Not decided: what a guest may still do, and the choices offered.</div>
    </div>
  </div>
  <div class="note">Figure: muted (grey, not breathing). The household accent is used; no personal accent is applied. Column: the same stage as 2, with a plain sentence.</div>
  <div class="note">Not decided: the guest's rights, whether to offer "Carry on as a guest", and the buttons, so none is drawn.</div>
</figure>

<!-- 8 -->
<figure class="screen">
  <figcaption><h2>8. Home cannot be reached</h2><p>A slim plain bar at the top. The saved screen stays as it was.</p></figcaption>
  <div class="frame tab wallpaper dark">
    <div class="plainbar"><span class="w"></span><span class="grow">Cannot reach home. Showing what was saved.</span><span class="t-2">Trying again</span></div>
    <div class="clock shadow" style="top:var(--s-12)"><div class="t-display-xl num">9:41</div><div class="t-strong" style="margin-top:6px">Saturday 28 November</div></div>
    <div class="glass shelf"></div>
    <div class="on-shelf"><span class="figure" style="--size:80px"><span class="character muted" style="--size:80px"></span></span></div>
    <div class="bars">
      <div class="sb"><span class="ico"></span><span>Pasta &middot; 07:42</span></div>
      <div class="sb"><span class="ico"></span><span>Bins go out tonight</span></div>
      <div class="sb"><span class="ico"></span><span>Shopping &middot; 3 items</span></div>
    </div>
  </div>
  <div class="note">Bar: plain, not glass, one sentence, under the top of the screen; it goes when the connection returns. The saved idle content stays usable; the clock keeps running.</div>
  <div class="note">Not decided: whether the bar is the same on a tablet, which has no top bar, and what the figure does while out of reach (muted is a stand-in).</div>
</figure>

<!-- 9 -->
<figure class="screen">
  <figcaption><h2>9. Low power</h2><p>After a long quiet the screen goes to true black.</p></figcaption>
  <div class="frame tab lowpower">
    <span class="t-display-xl num">9:41</span>
  </div>
  <div class="note">True black, no wallpaper, no glass, no figure, no bars and no animation. Only a dim clock. Voice or touch wakes the tablet to the idle screen (1). Timers still sound at their time.</div>
  <div class="note">Not decided: after how long it starts, and whether the clock shows at night or the screen is blank.</div>
</figure>

<!-- 10 -->
<figure class="screen">
  <figcaption><h2>10. Set-up: welcome</h2><p>First run follows Apple's: a "Hello", then one centred pane per step.</p></figcaption>
  <div class="frame tab backdrop light">
    <div class="topline"><span></span><div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div><span></span></div>
    <div class="glass-thick pane">
      <span class="figure" style="--size:72px"><span class="character" style="--size:72px"></span></span>
      <span class="t-display">Hello</span>
      <span class="t-label t-2">Let's set this tablet up for your household.</span>
      <span class="btn btn-primary" style="margin-top:var(--s-3);width:100%;height:48px">Continue</span>
    </div>
  </div>
  <div class="note">Five dots on top show the step; the current one takes the accent. One centred glass pane per step, with one primary button.</div>
  <div class="note">Not decided: the five steps, other than this welcome and the next one.</div>
</figure>

<!-- 11 -->
<figure class="screen">
  <figcaption><h2>11. Set-up: invite code</h2><p>An admin's invite code joins the tablet to the household.</p></figcaption>
  <div class="frame tab backdrop dark">
    <div class="topline"><span></span><div class="dots"><i></i><i class="on"></i><i></i><i></i><i></i></div><span></span></div>
    <div class="glass-thick pane">
      <span class="t-display">Enter the invite code</span>
      <span class="t-label t-2">An admin can make one in the admin panel.</span>
      <div class="codes"><span>K</span><span>7</span><span>M</span><span>2</span><span class="cur"></span><span></span></div>
      <span class="btn btn-primary" style="margin-top:var(--s-2);width:100%;height:48px">Join</span>
    </div>
  </div>
  <div class="note">Six code boxes, the on-screen keyboard below (not drawn) and Join as the only primary button. After a valid code the pane says an admin must approve the device, then the tablet moves to the idle screen (1) by itself.</div>
  <div class="note">Not decided: what the pane shows when a code is refused or has expired.</div>
</figure>

</div>
</div>
</body>
</html>
